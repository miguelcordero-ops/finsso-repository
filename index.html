<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Finsso Dashboards</title>
<style>
:root{
  --primary:#E8461E;--accent:#F97316;
  --text:#111827;--text2:#4B5563;--text3:#9CA3AF;
  --glass:rgba(255,255,255,0.65);--glass-b:rgba(255,255,255,0.8);
  --shadow:0 8px 32px rgba(99,102,241,0.08),0 2px 8px rgba(0,0,0,0.06);
  --shadow-h:0 14px 40px rgba(99,102,241,0.14),0 4px 12px rgba(0,0,0,0.08);
  --soon-bg:rgba(0,0,0,0.06);--live-bg:rgba(34,197,94,0.12);--live-t:#15803d;
}
@media (prefers-color-scheme:dark){
  :root{--text:#F3F4F6;--text2:#B6BCC8;--text3:#7C8494;
    --glass:rgba(30,34,48,0.7);--glass-b:rgba(255,255,255,0.08);
    --shadow:0 8px 32px rgba(0,0,0,0.35);--shadow-h:0 14px 40px rgba(0,0,0,0.5);
    --soon-bg:rgba(255,255,255,0.08);--live-bg:rgba(34,197,94,0.18);--live-t:#4ade80}
  body{background:radial-gradient(ellipse at 15% 10%,#3a2018 0%,transparent 55%),radial-gradient(ellipse at 85% 90%,#1b2540 0%,transparent 55%),#10131c !important}
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(ellipse at 15% 10%,#FFE8D6 0%,transparent 55%),radial-gradient(ellipse at 85% 90%,#DDE8FF 0%,transparent 55%),radial-gradient(ellipse at 50% 50%,#F5F0FF 0%,transparent 80%),#F0F4FD;
  background-attachment:fixed;color:var(--text);-webkit-font-smoothing:antialiased}
header{padding:40px 24px 20px;text-align:center}
header h1{font-size:26px;font-weight:600;color:var(--primary);letter-spacing:-0.3px}
header p{font-size:13px;color:var(--text3);margin-top:6px}
main{max-width:960px;margin:0 auto;padding:8px 20px 60px}
.view{animation:in .32s ease both}
.view.rev{animation:inb .32s ease both}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.folders{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:560px){.folders{grid-template-columns:1fr}}
.folder{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px 22px 20px;margin-top:14px;
  background:var(--glass);border:1px solid var(--glass-b);border-radius:6px 18px 18px 18px;box-shadow:var(--shadow);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.folder::before{content:"";position:absolute;top:-12px;left:0;width:84px;height:14px;border-radius:8px 8px 0 0;
  background:linear-gradient(135deg,var(--accent),var(--primary))}
a.folder:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.folder.disabled{opacity:.55;cursor:default}
.folder.disabled::before{background:#94a3b8}
.ficon,.card-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--primary));
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(232,70,30,0.25)}
.disabled .ficon{background:linear-gradient(135deg,#cbd5e1,#94a3b8);box-shadow:none}
.ficon svg,.card-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ftitle{font-size:16px;font-weight:600}
.fdesc{font-size:12px;color:var(--text2);line-height:1.5}
.fmeta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--text3);margin-top:auto}
.fmeta .arrow{margin-left:auto;color:var(--primary);font-size:16px}
.back{display:inline-block;font-size:13px;color:var(--primary);text-decoration:none;margin:6px 0 14px;font-weight:500}
.back:hover{text-decoration:underline}
.gtitle{font-size:20px;font-weight:600;margin-bottom:4px}
.gdesc{font-size:13px;color:var(--text2);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:10px;padding:22px;background:var(--glass);border:1px solid var(--glass-b);
  border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.card.disabled{opacity:.55}
.card.disabled .card-icon{background:linear-gradient(135deg,#cbd5e1,#94a3b8);box-shadow:none}
.card-title{font-size:14px;font-weight:600}
.card-desc{font-size:12px;color:var(--text2);line-height:1.5}
.badge{align-self:flex-start;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:9999px}
.badge.live{background:var(--live-bg);color:var(--live-t)}
.badge.soon{background:var(--soon-bg);color:var(--text3)}
.empty{font-size:13px;color:var(--text3);padding:24px;text-align:center}
footer{text-align:center;padding:0 24px 40px;font-size:11px;color:var(--text3)}
</style></head>
<body>
<header>
  <h1>PH Finsso Dashboards</h1>
  <p>Internal reporting — sign in with your Finsso Google account to open any dashboard</p>
</header>
<main><div id="view" class="view"></div></main>
<footer>Finsso Dashboard Backend · Carbay Services Private Limited</footer>

<script>
/* ===== To add a dashboard: add an item to the right group below. ===== */
var I={
  chart:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/>',
  dpd:'<path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/>',
  team:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/><path d="M8 11h6"/><path d="M11 8v6"/>',
  check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'
};
var DPD={title:'DPD Aging Dashboard',href:'/dashboards/dpd/',icon:'dpd',desc:'Open loans by Days Past Due, month-on-month across the portfolio, with toggleable DPD definitions.'};
var GROUPS=[
  {id:'core',title:'Core & Leadership',icon:'chart',desc:'Portfolio-wide reporting for leadership.',items:[
    {title:'PH Core Synergy Report',href:'/dashboards/core/',icon:'chart',desc:'Transaction & Dealer Metrics — disbursements, DIF AUM, repossessions, and dealer onboarding, MTD vs LMTD.'},
    DPD]},
  {id:'sales',title:'Sales',icon:'team',desc:'Dealer pipeline, drawdowns and sales team performance.',items:[
    {title:'Sales Weekly Review',href:'/dashboards/weekly-review/',icon:'cal',desc:'Onboarded dealers with weekly actual drawdowns and planned fresh / re-drawdown inputs and remarks, by month.'},
    {title:'Sales Team Performance',href:'/dashboards/sales-team/',icon:'team',desc:'Team Marah, Albert & Malou — visits, onboarding, drawdowns, GMV & AUM, per team and per sales officer.'},
    {title:'Dealer Universe',href:'/dashboards/dealer-universe/',icon:'search',desc:'All dealers with IF / CF / MP tags and the IF funnel — visited, applied, onboarded and activated.'}]},
  {id:'collections',title:'Collections',icon:'shield',desc:'Past-due monitoring, stock audits and recoveries.',items:[
    DPD,
    {title:'Stock Audit',href:'/dashboards/stock-audit/',icon:'check',desc:'Field app for stock auditors and collections officers — prioritised audit schedule, itinerary, dealer and drawdown views, and photo audit uploads.'},
    {title:'Repossession Dashboard',soon:true,icon:'dpd',desc:'Repossessed unit inventory, liquidation status, and recovery tracking.'}]},
  {id:'credit',title:'Credit',icon:'money',desc:'Dealer credit profiles, exposure and risk flags.',items:[
    {title:'Dealer Credit Profile',href:'/dashboards/credit/',icon:'shield',desc:'Single-dealer credit view — credit line, exposure, full loan, payment and stock audit history, plus automatic risk flags.'}]}
];
function ico(k){return '<svg viewBox="0 0 24 24">'+(I[k]||I.folder)+'</svg>';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function counts(g){
  var live=g.items.filter(function(i){return !i.soon}).length, soon=g.items.length-live;
  if(g.soon&&!g.items.length)return '<span>Coming soon</span>';
  return '<span>'+live+' dashboard'+(live===1?'':'s')+'</span>'+(soon?'<span>· '+soon+' coming soon</span>':'');
}
function home(){
  return '<div class="folders">'+GROUPS.map(function(g){
    var tag=g.soon?'div':'a', href=g.soon?'':' href="#/'+g.id+'"';
    return '<'+tag+' class="folder'+(g.soon?' disabled':'')+'"'+href+'>'+
      '<div class="ficon">'+ico(g.icon)+'</div><div class="ftitle">'+esc(g.title)+'</div>'+
      '<div class="fdesc">'+esc(g.desc)+'</div><div class="fmeta">'+counts(g)+(g.soon?'':'<span class="arrow">→</span>')+'</div></'+tag+'>';
  }).join('')+'</div>';
}
function group(g){
  var cards=g.items.map(function(i){
    var inner='<div class="card-icon">'+ico(i.icon)+'</div><div class="card-title">'+esc(i.title)+'</div><div class="card-desc">'+esc(i.desc)+'</div>'+
      '<span class="badge '+(i.soon?'soon">Coming soon':'live">Live')+'</span>';
    return i.soon?'<div class="card disabled">'+inner+'</div>':'<a class="card" href="'+i.href+'">'+inner+'</a>';
  }).join('');
  return '<a class="back" href="#/">← All dashboards</a><div class="gtitle">'+esc(g.title)+'</div><div class="gdesc">'+esc(g.desc)+'</div><div class="grid">'+cards+'</div>';
}
var lastHome=true;
function route(){
  var id=(location.hash||'').replace(/^#\/?/,''), g=GROUPS.filter(function(x){return x.id===id&&!x.soon})[0];
  var v=document.getElementById('view');
  v.className='view'+(g?'':' rev'); void v.offsetWidth;
  v.innerHTML=g?group(g):home();
  document.title=(g?g.title+' · ':'')+'PH Finsso Dashboards';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
</body></html>
