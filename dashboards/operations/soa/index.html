<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E8461E">
<title>SOA Generator — Operations</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --primary:#E8461E;--accent:#F97316;--bg:#F0F4FD;--card:#FFFFFF;--card2:#F7F8FC;
  --border:rgba(0,0,0,0.09);--text:#111827;--text2:#4B5563;--text3:#8A92A0;
  --red:#DC2626;--red-bg:rgba(220,38,38,0.10);--orange:#EA580C;--orange-bg:rgba(234,88,12,0.11);
  --amber:#B45309;--amber-bg:rgba(245,158,11,0.15);--green:#15803D;--green-bg:rgba(22,163,74,0.12);
  --blue:#2563EB;--blue-bg:rgba(37,99,235,0.10);--grey-bg:rgba(107,114,128,0.12);
  --shadow:0 1px 2px rgba(0,0,0,0.05),0 4px 14px rgba(30,41,90,0.07);
  --nav-h:62px;--r:14px;
}
:root[data-theme="dark"]{
  --bg:#0B0F1A;--card:#161B29;--card2:#1C2233;--border:rgba(255,255,255,0.10);
  --text:#E5E7EB;--text2:#A1A9B8;--text3:#6B7280;
  --red:#F87171;--red-bg:rgba(248,113,113,0.14);--orange:#FB923C;--orange-bg:rgba(251,146,60,0.14);
  --amber:#FBBF24;--amber-bg:rgba(251,191,36,0.14);--green:#4ADE80;--green-bg:rgba(74,222,128,0.13);
  --blue:#60A5FA;--blue-bg:rgba(96,165,250,0.14);--grey-bg:rgba(156,163,175,0.14);
  --shadow:0 1px 2px rgba(0,0,0,0.4),0 4px 14px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}html[data-theme="dark"]{color-scheme:dark}html[data-theme="light"]{color-scheme:light}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:40px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:200;background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.brand{font-weight:700;color:var(--primary);font-size:17px;letter-spacing:-0.3px;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--text3);font-weight:500;letter-spacing:0}
.top-sp{flex:1}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.who-txt{line-height:1.2;min-width:0}.who-txt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}.who-txt span{font-size:11px;color:var(--text3)}
.icon-btn{border:1px solid var(--border);background:var(--card2);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--text2)}
.lens{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media(max-width:700px){
  .topbar{flex-wrap:wrap;row-gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
  .who-txt{display:none}
  .lens{order:5;width:100%}
  .lens:empty{display:none}
  .brand{font-size:16px}
  .main{padding:12px}
}

/* ── navigation: top tabs on laptop, bottom bar on phone ── */
.nav{display:flex;gap:4px;position:fixed;left:0;right:0;bottom:0;z-index:250;background:var(--card);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,0.08)}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:5px 2px;border-radius:10px;color:var(--text3);min-height:46px;font-weight:600}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--primary);background:rgba(232,70,30,0.09)}
.nav button.hide{display:none}
.nav .fab{color:#fff;background:linear-gradient(135deg,var(--accent),var(--primary));margin:-14px 4px 0;border-radius:16px;box-shadow:0 6px 16px rgba(232,70,30,0.35);flex:1.15}
.nav .fab.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--primary))}
@media(min-width:900px){
  body{padding-bottom:30px}
  .nav{position:sticky;top:55px;bottom:auto;border-top:0;border-bottom:1px solid var(--border);box-shadow:none;padding:0 16px;gap:2px;justify-content:flex-start;z-index:190}
  .nav button{flex:none;flex-direction:row;gap:7px;font-size:13px;padding:11px 16px;border-radius:0;border-bottom:3px solid transparent;min-height:0}
  .nav button.on{background:none;border-bottom-color:var(--primary)}
  .nav .fab{margin:6px 0 6px 10px;border-radius:10px;padding:7px 16px;border-bottom:0;flex:none}
  .nav .fab.on{border-bottom:0}
}

/* ── layout ── */
.main{max-width:1180px;margin:0 auto;padding:16px}
.h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}.sub{color:var(--text3);font-size:12.5px;margin-top:2px}
.sec{margin-top:20px}.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}.sec-h h2{font-size:15px;font-weight:700}.sec-h .sub{margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;text-align:left;cursor:pointer;display:block;width:100%}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-0.5px;line-height:1.1}.kpi .l{font-size:11.5px;color:var(--text2);margin-top:3px;font-weight:600}.kpi .s{font-size:10.5px;color:var(--text3);margin-top:1px}
.kpi.red .n{color:var(--red)}.kpi.orange .n{color:var(--orange)}.kpi.amber .n{color:var(--amber)}.kpi.green .n{color:var(--green)}.kpi.blue .n{color:var(--blue)}
.two{display:grid;gap:14px}@media(min-width:900px){.two{grid-template-columns:1.5fr 1fr}}
.cols3{display:grid;gap:12px}@media(min-width:760px){.cols3{grid-template-columns:repeat(2,1fr)}}@media(min-width:1100px){.cols3{grid-template-columns:repeat(3,1fr)}}

/* ── pills / chips / buttons ── */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-crit{background:var(--red);color:#fff}.p-high{background:var(--orange-bg);color:var(--orange)}.p-soon{background:var(--amber-bg);color:var(--amber)}.p-ok{background:var(--grey-bg);color:var(--text2)}
.t-red{background:var(--red-bg);color:var(--red)}.t-orange{background:var(--orange-bg);color:var(--orange)}.t-green{background:var(--green-bg);color:var(--green)}.t-blue{background:var(--blue-bg);color:var(--blue)}.t-grey{background:var(--grey-bg);color:var(--text2)}.t-amber{background:var(--amber-bg);color:var(--amber)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--text2);min-height:34px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--primary);color:#fff}
.btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--primary));border-color:transparent;color:#fff}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12px;border-radius:8px}
.btn.ghost{background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.search{width:100%;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px 12px;min-height:42px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.toolbar .search{flex:1;min-width:180px}
.empty{padding:30px 14px;text-align:center;color:var(--text3)}
.muted{color:var(--text3)}.small{font-size:12px}.b{font-weight:700}

/* ── work items ── */
.item{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--grey-bg);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.item.crit{border-left-color:var(--red)}.item.high{border-left-color:var(--orange)}.item.soon{border-left-color:var(--amber)}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item-t{font-weight:700;font-size:14px}.item-s{font-size:12px;color:var(--text2)}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.list{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.dcard-h{padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.dcard-body[hidden]{display:none}
.dcard-body{border-top:1px solid var(--border);background:var(--card2);padding:10px;display:flex;flex-direction:column;gap:8px}
.dcard .addr{font-size:12px;color:var(--text2)}
.dd-mini{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--grey-bg);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.dd-mini.crit{border-left-color:var(--red)}.dd-mini.high{border-left-color:var(--orange)}.dd-mini.soon{border-left-color:var(--amber)}
.stopno{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.bar{height:8px;border-radius:99px;background:var(--grey-bg);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:99px}

/* ── data table (every column filterable) ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 230px);-webkit-overflow-scrolling:touch}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.dt th{position:sticky;top:0;z-index:3;background:var(--card2);text-align:left;padding:0;border-bottom:1px solid var(--border);white-space:nowrap}
.dt th .th{display:flex;align-items:center;gap:4px;padding:9px 8px 9px 10px;font-weight:700;font-size:11.5px;color:var(--text2)}
.dt th .th span{flex:1;cursor:pointer;user-select:none}
.fbtn{border:0;background:none;padding:3px 5px;border-radius:6px;color:var(--text3);font-size:11px}
.fbtn.on{background:var(--primary);color:#fff}
.dt td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card)}
.dt tr:hover td{background:var(--card2)}
.dt td.fz,.dt th.fz{position:sticky;left:0;z-index:4;box-shadow:2px 0 0 var(--border)}
.dt th.fz{z-index:6}
.dt td.num,.dt th.num .th{text-align:right;justify-content:flex-end}
.dt td.click{cursor:pointer}
.fpanel{position:fixed;z-index:1200;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,0.25);width:290px;max-width:calc(100vw - 20px);max-height:70vh;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.fpanel .row{display:flex;gap:6px}.fpanel button.o{flex:1;border:1px solid var(--border);background:var(--card2);border-radius:8px;padding:7px;font-size:12px;font-weight:600}
.fpanel input[type=text],.fpanel select{width:100%;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:8px}
.fpanel .vals{max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:4px}
.fpanel label{display:flex;gap:8px;align-items:center;padding:5px 6px;font-size:12.5px;border-radius:6px}
.fpanel label:hover{background:var(--card2)}
.fpanel h6{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:700px){.fpanel{left:8px!important;right:8px;bottom:8px;top:auto!important;width:auto;max-height:78vh}}

/* ── sheet / modal ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:900;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,0.3)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-size:16px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin:10px 0}
.kv div{font-size:12.5px}.kv span{display:block;font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:8px}.tl .e{border-left:3px solid var(--grey-bg);padding:2px 0 2px 10px;font-size:12.5px}.tl .e.f{border-left-color:var(--red)}.tl .e.p{border-left-color:var(--green)}

/* ── form ── */
.form{display:flex;flex-direction:column;gap:14px;max-width:720px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld>.lab{font-size:12px;font-weight:700;color:var(--text2)}
.fld .req{color:var(--red)}
.inp{width:100%;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:11px 12px;min-height:46px;font-size:15px}
textarea.inp{min-height:84px;resize:vertical}
.inp[readonly]{background:var(--card2);color:var(--text2)}
.hint{font-size:11.5px;color:var(--text3)}
.bigseg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigseg button{border:2px solid var(--border);background:var(--card);border-radius:12px;padding:14px;font-weight:800;font-size:16px}
.bigseg button.on.pass{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.bigseg button.on.fail{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.ph img{width:100%;height:100%;object-fit:cover}.ph button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;width:22px;height:22px;border-radius:50%;font-size:13px;line-height:1}
.addph{width:76px;height:76px;border-radius:10px;border:2px dashed var(--border);background:var(--card2);color:var(--text2);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.callout{border-radius:12px;padding:10px 12px;font-size:12.5px}
.callout.warn{background:var(--amber-bg);color:var(--amber)}.callout.bad{background:var(--red-bg);color:var(--red)}.callout.good{background:var(--green-bg);color:var(--green)}.callout.info{background:var(--blue-bg);color:var(--blue)}
.stickyact{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);display:flex;gap:10px;padding:10px 0;background:linear-gradient(to top,var(--bg) 70%,transparent)}
@media(min-width:900px){.stickyact{bottom:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:2000;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:90vw}
.toast.err{background:var(--red)}
.spin{width:18px;height:18px;border:3px solid var(--grey-bg);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:70px 20px;color:var(--text3)}

/* ── lock ── */
.lock-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .35s}
.lock-overlay.unlocking{opacity:0;pointer-events:none}.lock-overlay.hidden{display:none}
.lock-card{background:var(--card);border:1px solid var(--border);box-shadow:0 30px 80px rgba(30,41,90,0.2);border-radius:26px;padding:34px 30px 26px;width:360px;max-width:92vw;display:flex;flex-direction:column;align-items:center}
.lock-icon-box{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--primary));box-shadow:0 4px 16px rgba(232,70,30,0.30);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.lock-icon-box svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lock-title{font-size:18px;font-weight:700;margin-bottom:6px;text-align:center}.lock-sub{font-size:12.5px;color:var(--text3);margin-bottom:20px;text-align:center;line-height:1.6}
.lock-signin{min-height:44px;display:flex;justify-content:center}.lock-error-msg{font-size:12px;color:var(--red);margin-top:10px;min-height:16px;text-align:center}
.lock-contact{font-size:11px;color:var(--text3);text-align:center;margin-top:14px}.lock-contact a{color:var(--primary);text-decoration:underline}

/* ── credit dashboard additions ── */
.main{max-width:1320px}
.srch{position:relative;flex:1;min-width:240px}
.srch .res{position:absolute;left:0;right:0;top:46px;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.22);max-height:60vh;overflow:auto}
.srch .res .r{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.srch .res .r:hover,.srch .res .r.hi{background:var(--card2)}
.srch .res .r:last-child{border-bottom:0}
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.hero h1{font-size:22px;letter-spacing:-.4px}
.rating{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;font-weight:800;font-size:14px}
.rating small{font-weight:600;font-size:11px;opacity:.85;display:block}
.r-red{background:var(--red-bg);color:var(--red)}.r-amber{background:var(--amber-bg);color:var(--amber)}.r-green{background:var(--green-bg);color:var(--green)}.r-grey{background:var(--grey-bg);color:var(--text2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:16px 0 14px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:13px;color:var(--text3);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.flags{display:grid;gap:8px}
@media(min-width:900px){.flags{grid-template-columns:repeat(2,1fr)}}
.flag{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;border:1px solid var(--border);background:var(--card)}
.flag .ic{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;margin-top:1px}
.flag.red{background:var(--red-bg);border-color:transparent}.flag.red .ic{background:var(--red)}
.flag.amber{background:var(--amber-bg);border-color:transparent}.flag.amber .ic{background:#D97706}
.flag.green{background:var(--green-bg);border-color:transparent}.flag.green .ic{background:#16A34A}
.flag.info .ic{background:var(--text3)}
.flag b{display:block;font-size:13px}.flag span{font-size:12px;color:var(--text2)}
.ckpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.ckpis{grid-template-columns:repeat(4,1fr)}}

<script>

function parseSheetDate(v) {
  if (v === null || v === undefined) return null;

    const serial = Math.floor(parseFloat(s));

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];

      else if (ch === ',') { row.push(field); field = ''; }

function normHeader(h) { return String(h == null ? '' : h).replace(/[\s\u00a0]+/g, ' ').trim(); }

  const idx = {};
  headerRow.forEach((h, i) => { const key = normHeader(h); if (key && !(key in idx)) idx[key] = i; });
  return function (name) { const k = normHeader(name); return idx[k] !== undefined ? idx[k] : -1; };
}
function get(row, i) { return i >= 0 && i < row.length ? row[i] : ''; }

function normName(s) { return String(s || '').replace(/[\s ]+/g, ' ').trim(); }

  { const _b = await bqFetch(name); if (_b !== null) return _b; }

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function diffDays(a, b) { return Math.round((sod(a) - sod(b)) / DAY_MS); }

/* ══════════════════════════════════════════════════
   DATA TABLE — a filter dropdown on EVERY column
   (sort A→Z / Z→A, filter by condition, filter by values with checkboxes)
══════════════════════════════════════════════════ */
function makeTable(host, cols, rows, o) {
  o = o || {};

  let cur = [];
  const txt = (c, r) => { const v = c.txt ? c.txt(r) : c.val(r); return v == null || v === '' ? '(blank)' : String(v); };
  const raw = (c, r) => { const v = c.val(r); return v instanceof Date ? v.getTime() : v; };
  function cond(c, f, r) {
    const v = raw(c, r), q = f.v;
    if (f.op === 'empty') return v === '' || v == null || v === 0 && c.type !== 'num';

      if (isNaN(n)) return true; const x = Number(v);

    }
    const s = String(v == null ? '' : v).toLowerCase(), t = String(q || '').toLowerCase();

    h += '</tr></thead><tbody>';

      '<h6>Filter by condition</h6><select data-k="op"><option value="">None</option>' + ops.concat([['empty', 'Is empty'], ['nempty', 'Is not empty']]).map(x => '<option value="' + x[0] + '"' + (f.op === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select>' +

      '<h6>Filter by values</h6><input type="text" data-k="q" placeholder="Search values…"><div class="row"><button class="o" data-s="all">Select all</button><button class="o" data-s="none">Clear</button></div><div class="vals" data-k="list"></div>' +
      '<div class="row"><button class="o" data-s="reset">Reset column</button><button class="o" data-s="done" style="background:var(--primary);color:#fff;border-color:var(--primary)">Done</button></div>';
    const list = p.querySelector('[data-k=list]');
    const draw = () => { const q = p.querySelector('[data-k=q]').value.toLowerCase(); const sel = f.sel;
      list.innerHTML = keys.filter(k => !q || k.toLowerCase().includes(q)).slice(0, 400).map(k => '<label><input type="checkbox" data-v="' + esc(k) + '"' + (!sel || sel.has(k) ? ' checked' : '') + '>' + esc(k) + ' <span class="muted small">(' + vals[k] + ')</span></label>').join('') || '<div class="empty small">No values</div>'; };
    draw();
    p.addEventListener('input', e => {
      if (e.target.dataset.k === 'q') draw();
      else if (e.target.dataset.k === 'v') { f.v = e.target.value; render(); }
    });
    p.addEventListener('change', e => {
      if (e.target.dataset.k === 'op') { f.op = e.target.value || undefined; render(); }
      else if (e.target.dataset.v !== undefined) {
        if (!f.sel) f.sel = new Set(keys);
        e.target.checked ? f.sel.add(e.target.dataset.v) : f.sel.delete(e.target.dataset.v);
        if (f.sel.size === keys.length) f.sel = undefined; render();
      }
    });
    p.addEventListener('click', e => {
      const s = e.target.dataset.s; if (!s) return;
      if (s === 'asc' || s === 'desc') { st.sort = { id, dir: s === 'asc' ? 1 : -1 }; render(); closePanel(); }
      else if (s === 'all') { f.sel = undefined; draw(); render(); }
      else if (s === 'none') { f.sel = new Set(); draw(); render(); }
      else if (s === 'reset') { delete st.f[id]; render(); closePanel(); }
      else if (s === 'done') closePanel();
    });
    document.body.appendChild(p); st.panel = p;
    const b = anchor.getBoundingClientRect();
    if (window.innerWidth > 700) { p.style.top = Math.min(b.bottom + 4, window.innerHeight - 340) + 'px'; p.style.left = Math.max(8, Math.min(b.left - 200, window.innerWidth - 300)) + 'px'; }
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
  }
  host.onclick = function (e) {
    const t = e.target.closest('[data-t]');
    if (t) {
      const k = t.dataset.t;
      if (k === 'sort') { const id = t.dataset.c; st.sort = st.sort && st.sort.id === id ? (st.sort.dir > 0 ? { id, dir: -1 } : null) : { id, dir: 1 }; render(); }
      else if (k === 'f') openPanel(t.dataset.c, t);
      else if (k === 'clear') { st.f = {}; st.sort = null; render(); }
      else if (k === 'csv') exportCsv();
      return;
    }
    const tr = e.target.closest('tr[data-i]');
    if (tr && o.onRow) o.onRow(cur[+tr.dataset.i]);
  };
  function exportCsv() {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [cols.map(c => q(c.label)).join(',')].concat(cur.map(r => cols.map(c => { const v = c.val(r); return q(v instanceof Date ? iso(v) : (c.txt && c.type !== 'num' ? c.txt(r) : v)); }).join(',')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = (o.csv || 'export') + '.csv'; a.click();
  }
  render();
  return { refresh(newRows) { rows = newRows; render(); }, rows: () => cur, preset(fn) { rows = fn(rows); render(); } };
}

<script>
/* ══════════════════════════════════════════════════════════════════════
   SOA CORE — statement logic, ported 1:1 from the SOA generator Apps Script
   (CFG, buildStatement_, computeLoan_ and the pure helpers). Only the Sheets,
   Drive and menu code is left out; two small browser adaptations are marked
   "BROWSER:" (numeric-string dates from CSV, and date formatting).
   ══════════════════════════════════════════════════════════════════════ */
const CFG = {
  LATE_FEE_PER_DAY: 350,
  PENALTY_PER_DAY: 500,
  GRACE_BUSINESS_DAYS: 2,
  RENEWAL_DAYS_AFTER_CREDIT: 29,  // R1 = Credit Date + 29 (Day 30, crediting date = Day 1); Rk = Credit Date + 30k - 1
  UPFRONT_INTEREST_DAYS: 30,      // interest deducted upfront at disbursal
  DEFAULT_TENURE: 180,
  MIN_PRINCIPAL_90: 0.10,        // 90-day loans: minimum principal at R1 and R2
  STEP_PRINCIPAL_180: 0.20,      // 180-day loans: principal at R3, R4, R5
  MATURITY_SHARE_180: 0.40,      // 180-day loans: principal left for maturity (before P0)
  COMPANY_NAME: 'Finsso Finance Corporation',
  COMPANY_ADDRESS: 'Unit B, 10F Uptown Bonifacio Tower 1, 11th Drive, BGC, Taguig',
  PAYMENT_TITLE: 'Payment Details — Inventory Funding',
  PAYMENT_DETAILS: [
    ['Bank Name', 'BDO (Banco de Oro)'],
    ['Branch Name', 'Fort Legends BGC'],
    ['Branch Address', 'G/F Fort Legend Tower, 3rd Ave, BGC, Taguig'],
    ['Account Name', 'Finsso Finance Corporation'],
    ['Account Number', '005688026935'],
  ],
};

// ---------------------------------------------------------------- tables
/** Pure: turns a 2D array (header row first) into {get(row, headerName)} lookups. */
function makeTable_(vals) {
  const norm = s => String(s).toLowerCase().replace(/\s+/g, ' ').trim();
  const idx = {};
  vals[0].forEach((h, i) => { const k = norm(h); if (k && !(k in idx)) idx[k] = i; });
  return {
    rows: vals.slice(1).filter(r => r.some(c => c !== '' && c != null)),
    get(row, name) { const i = idx[norm(name)]; return i == null ? '' : row[i]; },
    has(name) { return norm(name) in idx; },
  };
}

/** Pure: 90 when the tracker says 90, otherwise the 180-day default. */
function toTenure_(v) {
  const n = Math.round(toNum_(v));
  return n === 90 ? 90 : CFG.DEFAULT_TENURE;
}

// ---------------------------------------------------------------- statement builder (pure)
function buildStatement_(data, dealer, onlyId, A) {
  const { dis, drw, rep } = data;
  const key = s => String(s || '').trim();
  const drwById = {};
  drw.rows.forEach(r => { drwById[key(drw.get(r, 'Drawdown ID'))] = r; });

  const loans = [];
  dis.rows.forEach(r => {
    const id = key(dis.get(r, 'Drawdown ID'));
    if (!id) return;
    if (key(dis.get(r, 'Dealership Name')).toUpperCase() !== dealer.toUpperCase()) return;
    if (onlyId && id !== onlyId) return;
    if (key(dis.get(r, 'Transaction Router')).toLowerCase() === 'cancelled') return;
    const credit = toDay_(dis.get(r, 'Credit Date to Dealer Bank Account'));
    const pncm = toDay_(dis.get(r, 'PNCM Date'));
    if (credit == null || pncm == null) return;      // not yet disbursed
    if (pncm > A) return;                             // booked after the as-of date
    const d = drwById[id];
    // Loan Tenure: Disbursal col E mirrors Drawdown col G; fall back to the Drawdown tab
    const rawTen = dis.get(r, 'Loan Tenure') !== '' ? dis.get(r, 'Loan Tenure') : (d ? drw.get(d, 'Loan Tenure') : '');
    loans.push({
      id,
      principal: toNum_(dis.get(r, 'Original Principal')),
      rate: toRate_(dis.get(r, 'Interest Rate per Month')),
      pncm,
      credit,
      tenure: toTenure_(rawTen),
      // due dates exactly as the Drawdown Tracker has them (fallback: Credit Date + 29/59/..., maturity PNCM + tenure)
      dues: d ? {
        r1: toDay_(drw.get(d, 'R1 Due Date')), r2: toDay_(drw.get(d, 'R2 Due Date')),
        r3: toDay_(pick_(drw, d, ['R3P1 Due Date', 'R3 Due Date'])), r4: toDay_(pick_(drw, d, ['R4P2 Due Date', 'R4 Due Date'])),
        r5: toDay_(pick_(drw, d, ['R5P3 Due Date', 'R5 Due Date'])), mat: toDay_(drw.get(d, 'Maturity Due Date')),
      } : {},
      unit: [key(dis.get(r, 'Year Model')), key(dis.get(r, 'Make Model Variant'))].filter(Boolean).join(' '),
      plate: key(dis.get(r, 'Plate Number')),
      dealerName: key(dis.get(r, 'Dealer Name')) || (d ? key(drw.get(d, 'Dealer Name')) : ''),
      dealerId: d ? key(drw.get(d, 'Dealer ID')) : '',
      creditLine: d ? key(drw.get(d, 'Credit Line ID')) : '',
      financing: d ? key(drw.get(d, 'Type of Financing')) : '',
    });
  });

  const ids = new Set(loans.map(l => l.id));
  const pays = rep.rows.map(r => ({
    id: key(rep.get(r, 'Drawdown ID')),
    repId: key(rep.get(r, 'Repayment ID')),
    date: toDay_(rep.get(r, 'Dealer Payment Date')),
    tag: key(rep.get(r, 'Dealer Payment Type')).toLowerCase(),
    tagLabel: key(rep.get(r, 'Dealer Payment Type')),
    received: toNum_(pick_(rep, r, ['Finsso Total Received Amount', 'Finsso Received Amount from Dealer', 'Dealer Payment Amount'])),
    prin: toNum_(rep.get(r, 'Principal Applied')),
    int: toNum_(rep.get(r, 'Interest Applied')),
    ren: toNum_(rep.get(r, 'Renewal Fee Applied')),
    late: toNum_(rep.get(r, 'Late Fee Applied')),
    pen: toNum_(rep.get(r, 'Penalty Fee Applied')),
    extra: toNum_(pick_(rep, r, ['Extra Grace in Days', 'Extra Grace'])),
    coll: toNum_(pick_(rep, r, ['Collection Fee Applied'])),
    expColl: toNum_(pick_(rep, r, ['Expected Collection Fee'])),
  })).filter(p => ids.has(p.id) && (p.date != null ? p.date <= A : (p.extra > 0 || p.expColl > 0)))   // undated rows: grace / collection-fee placeholders
    .sort((a, b) => (a.date == null ? -Infinity : a.date) - (b.date == null ? -Infinity : b.date));

  // blank Drawdown ID = all OPEN drawdowns of the dealer (closed ones dropped); a chosen ID is always shown
  const all = loans.map(l => computeLoan_(l, pays.filter(p => p.id === l.id), A));
  const results = onlyId ? all : all.filter(x => x.status !== 'Closed');
  const keep = new Set(results.map(x => x.loan.id));
  // placeholder = row set up before payment (grace and/or collection fee), nothing received or applied yet
  const isPlaceholder = p => p.received <= 0.005 && p.prin + p.int + p.ren + p.late + p.pen + p.coll <= 0.005;
  const shownPays = pays.filter(p => keep.has(p.id) && !isPlaceholder(p));
  const graceGrants = pays.filter(p => keep.has(p.id) && p.extra > 0)
    .map(p => ({ id: p.id, tag: p.tagLabel, days: p.extra, date: p.date }));
  const sum = f => results.reduce((s, x) => s + f(x), 0);
  return {
    dealer, onlyId, asOf: A, generated: new Date(),
    head: loans[0] || {},
    loans: results,
    tenures: [...new Set(results.map(x => x.loan.tenure))].sort((a, b) => a - b),
    closedExcluded: all.length - results.length,
    payments: shownPays,
    graceGrants,
    totals: {
      principal: sum(x => x.loan.principal),
      outstanding: sum(x => x.outstanding),
      dueNow: sum(x => x.dueNow),
      pastDue: sum(x => x.pastDue),
      payoff: sum(x => x.payoff),
      received: shownPays.reduce((s, p) => s + p.received, 0),
    },
  };
}

/**
 * Pure: one loan as of day A. Mirrors the tracker formulas, with TODAY() replaced by A and
 * only Repayment rows dated on/before A.
 *
 * Checkpoints are numbered k = 1..N, where N is maturity (N = 3 for 90-day, 6 for 180-day).
 * The crediting date C is Day 1.
 * D(k)   = Credit Date + 30k - 1 = last day of interest period k (Day 30k).
 *          Renewals are due on D(k): R1 = C + 29 (Day 30), R2 = C + 59 (Day 60) ...
 * matDue = PNCM + 30N, moved off Sat/Sun to Monday (maturity due date).
 * Interest for a period = P x rate x days / 30, where days run from the end of the previous
 * period to this period's due date (or the actual payment date if later). Days 1-30 are the
 * upfront interest, so over the life of the loan this equals P x rate x (tenor days + 1) / 30.
 */
function computeLoan_(L, P, A) {
  P = P.slice();
  const K = L.principal, r = L.rate, p = L.pncm, G = CFG.GRACE_BUSINESS_DAYS;
  const C = L.credit != null ? L.credit : p;      // crediting date = Day 1
  const is90 = L.tenure === 90;
  const N = is90 ? 3 : 6;
  const dues = L.dues || {};
  // due dates come from the Drawdown Tracker; computed only if a cell is blank
  const matDue = dues.mat != null ? dues.mat : weekendToMonday_(p + 30 * N);
  const D = k => (dues['r' + k] != null ? dues['r' + k] : C + CFG.RENEWAL_DAYS_AFTER_CREDIT + 30 * (k - 1));   // Day 30k
  const DUE = k => (k === N ? matDue : D(k));
  const END = k => (k === N ? matDue : D(k));     // scheduled end of interest period k
  const T = k => 'renewal ' + k;
  const tg = k => x => x.tag === T(k);
  const isMat = x => x.tag === 'final repayment' || x.tag === 'partial repayment';
  const sumP = (f, v) => P.reduce((s, x) => s + (f(x) ? v(x) : 0), 0);
  const prinLE = (d, excl) => sumP(x => x.date <= d && (!excl || x.tag !== excl), x => x.prin);
  const cover = (f, v, t) => {
    const need = typeof t === 'function' ? t : () => t;     // t may depend on the payment date
    let c = 0;
    for (const x of P) if (f(x)) { c += v(x); if (x.date != null && c >= need(x.date) - 0.005) return x.date; }
    return null;
  };
  const waive = d => d == null ? 0 : Math.max(0, ...P.filter(x => x.date === d).map(x => x.extra));
  // Extra grace: on the row that cleared the period (old rule) OR on any row tagged with that
  // period, e.g. a "Renewal 2" row with nothing applied (grace granted before payment)
  const extTag = f => (f ? Math.max(0, ...P.filter(f).map(x => x.extra)) : 0);
  const graceEnd = (due, d, f) => workday_(due, G + Math.max(waive(d), extTag(f)));
  const r2 = x => Math.round(x * 100) / 100;

  // date principal was fully repaid (early payoff), if any
  let cum = 0, payoffDate = null;
  for (const x of P) { cum += x.prin; if (cum >= K - 0.005) { payoffDate = x.date; break; } }

  const paid = {}, amt = {};
  // paid date for a checkpoint
  const covered = (due, f, v, t) => {
    if (A < due) return null;
    if ((typeof t === 'function' ? t(due) : t) <= 0.005) return due;   // nothing billed for this period
    const d = cover(f, v, t);
    if (d != null) return d;
    // Paid off BEFORE this checkpoint fell due: nothing was billed, so it is closed.
    // A checkpoint already due at payoff stays open (and its fees keep running) until cleared.
    return payoffDate != null && payoffDate < due ? payoffDate : null;
  };
  // Interest is paid oldest period first, whatever row it is entered on: a period closes on the first
  // payment date where (a) its own renewal (+ 90-day minimum principal / maturity principal) on its tagged
  // rows is covered, and (b) ALL interest paid so far covers the interest of every earlier period plus
  // this period's interest accrued to that date.
  const closeWhen = (due, ownF, ownV, ownNeed, prevInt, intTo) => {
    if (A < due) return null;
    if (ownNeed + intTo(due) <= 0.005) return due;          // nothing billed for this period
    let own = 0, paidInt = 0;
    for (const x of P) {
      if (x.date == null) continue;
      paidInt += x.int;
      if (ownF(x)) own += ownV(x);
      if (own >= ownNeed - 0.005 && paidInt >= prevInt + intTo(x.date) - 0.005) return x.date;
    }
    return payoffDate != null && payoffDate < due ? payoffDate : null;
  };
  const intBefore = k => { let t = 0; for (let j = 1; j < k; j++) t += amt['int' + j] || 0; return t; };
  // start of interest period k = end of period k-1 (its due date, or its payment date if paid late).
  // Period 1 starts at Day 30: Days 1-30 are covered by the upfront interest.
  // Grace applies to interest too: a period paid within its grace (2 business days + Extra Grace) is
  // treated as paid on its due date (no extra-day interest); after grace, interest counts every day
  // from the due date. effEnd(k) = the date period k's interest runs to.
  const fk = k => (k === N ? (x => x.tag === 'final repayment') : tg(k));
  const effEnd = k => {
    const due = END(k), pd = paid['R' + k];
    if (pd != null) return pd <= graceEnd(due, pd, fk(k)) ? due : pd;
    return A <= graceEnd(due, null, fk(k)) ? due : A;
  };
  const effDay = (k, d) => (d <= graceEnd(END(k), d, fk(k)) ? END(k) : d);   // for a payment on day d
  const start = k => k === 1 ? D(1) : Math.max(END(k - 1), effEnd(k - 1));
  const intBase = k => r * Math.max(0, K - prinLE(start(k)));
  // 90-day minimum principal for R1/R2 (never more than what is still outstanding at that cycle)
  const minPrin = k => (is90 && k <= 2) ? r2(Math.min(CFG.MIN_PRINCIPAL_90 * K, Math.max(0, K - prinLE(DUE(k), T(k))))) : 0;

  const renewal = k => {
    const due = DUE(k);
    if (A < due) return 0;
    const rate = k <= 2 ? 0.01 : 0.015;
    const g = Math.max(0, K - prinLE(due, T(k)));
    const o = k <= 2 ? sumP(x => x.tag === T(k) && x.date <= graceEnd(due, null, tg(k)), x => x.prin)
      : Math.min(CFG.STEP_PRINCIPAL_180 * K, g);
    const om = k <= 2 ? Math.max(o, minPrin(k)) : o;   // 90-day: 10% is required, not optional
    const intb = k === 1 ? 0 : intBase(k);              // R1 on time = 0 extra days (upfront covers Day 1-30)
    const t = rate * (g - om) + intb + om;
    const d = t <= 0.005 ? null : cover(tg(k), x => x.ren + x.int + x.prin, t);
    const prior = k === 4 ? [paid.P1] : k === 5 ? [paid.P1, paid.P2] : [];
    const net = prior.every(v => v != null) && (d == null ? A <= graceEnd(due, null, tg(k)) : d <= graceEnd(due, d, tg(k)));
    return r2(rate * (g - (net ? o : 0)));
  };
  // period in which an early payoff happened: its interest (actual days) is settled with the final payment
  const kPay = payoffDate == null ? null : Array.from({ length: N - 1 }, (_, i) => i + 2).find(k => END(k) > payoffDate);
  const idays = {};                                  // interest days billed per period (shown on the SOA)
  const interest = k => {
    if (kPay != null && k >= kPay) {
      if (k !== N) { idays[k] = 0; return 0; }
      const s0 = start(kPay);
      idays[k] = Math.max(0, payoffDate - s0);
      return r2(r * Math.max(0, K - prinLE(s0)) * idays[k] / 30);
    }
    const s = start(k);
    let e = Math.max(END(k), effEnd(k));
    if (payoffDate != null && payoffDate < e) e = Math.max(s, payoffDate);   // no interest after full payoff
    idays[k] = Math.max(0, e - s);
    return r2(r * Math.max(0, K - prinLE(s)) * idays[k] / 30);
  };
  const fee = (due, pd, perDay, f) => {
    if (A < due) return 0;
    const e = pd != null ? pd : A;
    return e > graceEnd(due, pd, f) ? perDay * (e - due) : 0;
  };

  // ---- renewals (k = 1..N-1); 90-day R1/R2 also need the 10% principal to count as paid
  for (let k = 1; k <= N - 1; k++) {
    amt['ren' + k] = renewal(k);
    amt['min' + k] = minPrin(k);
    const withPrin = is90 && k <= 2;
    // R period closes only when its renewal AND all interest accrued up to that payment date are paid
    // (plus the 10% minimum principal on 90-day loans). Until then interest and the late fee keep running.
    const sK = start(k), balK = Math.max(0, K - prinLE(sK));
    const intTo = d => r * balK * Math.max(0, Math.max(END(k), effDay(k, d)) - sK) / 30;
    paid['R' + k] = closeWhen(DUE(k), tg(k), x => x.ren + (withPrin ? x.prin : 0),
      amt['ren' + k] + amt['min' + k], intBefore(k), intTo);
    if (!is90 && k >= 3) {
      const j = k - 2;
      const step = Math.min(CFG.STEP_PRINCIPAL_180 * K, Math.max(0, K - prinLE(DUE(k), T(k))));
      amt['prin' + j] = r2(step);
      paid['P' + j] = covered(DUE(k), tg(k), x => x.prin, step);
    }
    amt['int' + k] = A < DUE(k) ? 0 : interest(k);   // R1 interest = days after Day 30 only
  }
  // ---- maturity
  const p0 = sumP(x => x.tag === T(1) || x.tag === T(2), x => x.prin);
  amt.prinM = r2(Math.max(0, (is90 ? 1 : CFG.MATURITY_SHARE_180) * K - p0));
  const sM = start(N), balM = Math.max(0, K - prinLE(sM));
  paid.M = closeWhen(matDue, isMat, x => x.prin, amt.prinM, intBefore(N),
    d => r * balM * Math.max(0, Math.max(matDue, effDay(N, d)) - sM) / 30);
  paid.MP = covered(matDue, isMat, x => x.prin, amt.prinM);        // penalty stops when principal is paid
  paid['R' + N] = paid.M;
  amt.intM = interest(N);

  // ---- checkpoint line items (amount billed vs applied by tag)
  const ap = (tagF, v) => sumP(tagF, v);
  const item = (name, amount, applied, kind) => ({ name, amount: r2(amount), applied: r2(applied), kind });
  const cpLabel = k => k === N ? 'Maturity' : (is90 || k <= 2) ? 'R' + k : `R${k}/P${k - 2}`;
  const cps = [];
  for (let k = 1; k <= N - 1; k++) {
    const items = [item('Renewal fee', amt['ren' + k], ap(tg(k), x => x.ren), 'fee')];
    const dd = idays[k] || 0;
    items.push(item(k === 1 ? `Interest (${dd} day${dd === 1 ? '' : 's'} after R1 due date)` : `Interest (${dd} days)`, amt['int' + k], ap(tg(k), x => x.int), 'fee'));
    if (is90) items.push(item('Principal (10% minimum)', amt['min' + k], ap(tg(k), x => x.prin), 'prin'));
    items.push(item('Late fee', fee(DUE(k), paid['R' + k], CFG.LATE_FEE_PER_DAY, tg(k)), ap(tg(k), x => x.late), 'fee'));
    const c = { cp: cpLabel(k), due: DUE(k), paidR: paid['R' + k], items, f: tg(k) };
    if (!is90 && k >= 3) {
      const j = k - 2;
      items.push(item(`Principal (P${j}, 20%)`, amt['prin' + j], ap(tg(k), x => x.prin), 'prin'));
      items.push(item('Penalty fee', fee(DUE(k), paid['P' + j], CFG.PENALTY_PER_DAY, tg(k)), ap(tg(k), x => x.pen), 'fee'));
      c.paidP = paid['P' + j];
    }
    cps.push(c);
  }
  const finTag = x => x.tag === 'final repayment';
  cps.push({ cp: 'Maturity', due: matDue, paidR: paid.M, paidP: paid.M, f: finTag, items: [
    item(`Interest (${idays[N] || 0} days)`, amt.intM, ap(x => x.tag === 'final repayment', x => x.int), 'fee'),
    item('Principal (balance)', amt.prinM, ap(isMat, x => x.prin), 'prin'),
    // maturity gets the same 2-business-day grace (+ Extra Grace) as every other due date
    item('Penalty fee', fee(matDue, paid.MP, CFG.PENALTY_PER_DAY, finTag), ap(finTag, x => x.pen), 'fee'),
  ]});

  // ---- collection fees: billed via "Expected Collection Fee" on a row tagged with the period
  //      (Renewal k, or Final/Partial Repayment for maturity); anything else goes to "Other charges"
  const cycleOf = x => {
    const m = /^renewal ([1-5])$/.exec(x.tag);
    if (m) return +m[1] <= N - 1 ? +m[1] : null;
    return isMat(x) ? N : null;
  };
  for (let k = 1; k <= N; k++) {
    const f = x => cycleOf(x) === k;
    const billed = sumP(f, x => x.expColl), paidColl = sumP(f, x => x.coll);
    if (billed > 0.005 || paidColl > 0.005) cps[k - 1].items.push(Object.assign(item('Collection fee', billed, paidColl, 'fee'), { charged: true }));
  }
  const otherRows = P.filter(x => cycleOf(x) == null && (x.expColl > 0.005 || x.coll > 0.005));
  if (otherRows.length) {
    const dated = otherRows.filter(x => x.date != null).map(x => x.date);
    cps.push({ cp: 'Other charges', due: dated.length ? Math.min(...dated) : A, f: null, items: [
      Object.assign(item('Collection fee', sumP(x => otherRows.includes(x), x => x.expColl), sumP(x => otherRows.includes(x), x => x.coll), 'fee'), { charged: true })] });
  }

  // ---- interest applied oldest period first (each period still shows as its own line)
  const intItems = [];
  cps.forEach(c => c.items.forEach(it => { if (it.name.startsWith('Interest')) intItems.push(it); }));
  let poolInt = intItems.reduce((t, it) => t + it.applied, 0);
  intItems.forEach(it => { const use = Math.min(it.amount, Math.max(0, poolInt)); it.applied = r2(use); poolInt -= use; });
  if (poolInt > 0.005 && intItems.length) intItems[intItems.length - 1].applied = r2(intItems[intItems.length - 1].applied + poolInt);

  // ---- balances as of A (only checkpoints already due)
  const totalPrinPaid = sumP(() => true, x => x.prin);
  const outstanding = r2(Math.max(0, K - totalPrinPaid));
  let prinRoom = outstanding;                       // principal due can never exceed what's outstanding
  const dueLines = [];
  let dueNow = 0, pastDue = 0, feesDue = 0;
  cps.forEach(c => {
    const isDue = A >= c.due;
    const ext = extTag(c.f);
    const gEnd = graceEnd(c.due, null, c.f);
    c.items.forEach(it => {
      // a collection fee is payable as soon as it is entered, even if its period is not yet due
      const itemDue = isDue || it.charged;
      let bal = Math.max(0, it.amount - it.applied);
      if (it.kind === 'prin') { bal = Math.min(bal, prinRoom); if (isDue) prinRoom -= bal; }
      it.balance = r2(itemDue ? bal : 0);
      if (itemDue && it.balance > 0.005) {
        const late = isDue && A > gEnd;
        dueLines.push({ cp: c.cp, due: c.due, name: it.name, amount: it.amount, applied: it.applied,
          balance: it.balance, dpd: Math.max(0, A - c.due),
          status: !isDue ? 'Due' : late ? 'Past due' : ext > 0 ? `In grace (extended to ${fmtDate_(gEnd, 'd-MMM')})` : 'In grace' });
        dueNow += it.balance;
        if (late) pastDue += it.balance;
        if (it.kind !== 'prin') feesDue += it.balance;
      }
    });
  });

  // ---- accrued interest on the current (not yet due) period, for payoff
  let accrued = 0;
  for (let k = 1; k <= N && payoffDate == null; k++) {
    if (A < END(k)) {
      const s = start(k);
      if (A > s) accrued = r * Math.max(0, K - prinLE(s)) * (A - s) / 30;
      break;
    }
  }
  accrued = r2(accrued);

  // ---- previous checkpoint
  const tagRows = k => k === N ? x => x.tag === 'final repayment' : tg(k);
  let prev = null;
  const prevK = Array.from({ length: N }, (_, i) => N - i).find(k => DUE(k) <= A);
  if (prevK) {
    const c = cps[prevK - 1];
    const owed = c.items.reduce((t, it) => t + it.balance, 0);
    const pd = Math.max(c.paidR || 0, c.paidP || 0);
    prev = { cp: cpLabel(prevK), text: owed <= 0.005 && (c.paidR != null || c.paidP != null)
      ? `${cpLabel(prevK)} settled ${fmtDate_(pd, 'd-MMM-yyyy')}`
      : owed <= 0.005 ? `${cpLabel(prevK)} settled`
      : `${cpLabel(prevK)} unpaid (PHP ${owed.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}) - see Amounts Due` };
  }

  // ---- next due: first upcoming checkpoint not already settled in advance, itemised
  let next = null;
  if (outstanding > 0.005) {
    const skipped = [];
    for (let k = 1; k <= N; k++) {
      if (DUE(k) <= A) continue;
      const f = tagRows(k);
      const bal = outstanding;
      const lines = [];
      if (k < N) {
        const rate = k <= 2 ? 0.01 : 0.015;
        const step = is90 ? Math.min(CFG.MIN_PRINCIPAL_90 * K, bal)
          : k >= 3 ? Math.min(CFG.STEP_PRINCIPAL_180 * K, bal) : 0;
        lines.push({ name: is90 ? 'Renewal fee (1%, net of 10% principal)'
          : k <= 2 ? 'Renewal fee (1% of principal)' : 'Renewal fee (1.5%, net of principal step)',
          est: rate * (bal - step), paid: ap(f, x => x.ren) });
        if (k >= 2) {
          const s0 = start(k);
          lines.push({ name: `Interest (${Math.max(0, END(k) - s0)} days)`, est: r * bal * Math.max(0, END(k) - s0) / 30, paid: ap(f, x => x.int) });
        }
        if (is90) lines.push({ name: 'Principal (10% minimum of original)', est: step, paid: ap(f, x => x.prin) });
        else if (k >= 3) lines.push({ name: `Principal P${k - 2} (20% of original)`, est: step, paid: ap(f, x => x.prin) });
      } else {
        const s0 = start(N);
        lines.push({ name: `Interest (${Math.max(0, matDue - s0)} days)`, est: r * bal * Math.max(0, matDue - s0) / 30, paid: ap(f, x => x.int) });
        lines.push({ name: 'Principal (remaining balance)', est: bal, paid: 0 });
      }
      lines.forEach(l => { l.est = r2(l.est); l.paid = r2(Math.min(l.paid, l.est)); l.balance = r2(Math.max(0, l.est - l.paid)); });
      const remaining = lines.reduce((t, l) => t + l.balance, 0);
      if (remaining <= 0.005) { skipped.push(cpLabel(k)); continue; }   // already settled in advance
      next = { cp: cpLabel(k), due: DUE(k), lines, total: r2(remaining),
        note: skipped.length ? `${skipped.join(', ')} already settled in advance` : '' };
      break;
    }
  }

  const pastLines = dueLines.filter(l => l.status === 'Past due');
  let status;
  if (outstanding <= 0.005 && dueNow <= 0.005) status = 'Closed';
  else if (pastLines.length) status = 'Overdue (' + [...new Set(pastLines.map(l => l.cp))].join(', ') + '; ' +
    Math.max(...pastLines.map(l => l.dpd)) + ' DPD)';
  else if (dueNow > 0.005) status = dueLines.some(l => l.status.startsWith('In grace (extended')) ? 'Due - extended grace' : 'Due - in grace';
  else status = 'Current';

  return {
    loan: L, maturity: matDue, outstanding, dueNow: r2(dueNow), pastDue: r2(pastDue),
    payoff: r2(outstanding + feesDue + accrued), accrued, dueLines, next, prev, status, checkpoints: cps, paid,
  };
}

/** Pure: statement notes for the tenures shown on this SOA. */
function scheduleNotes_(tenures) {
  const t = tenures && tenures.length ? tenures : [CFG.DEFAULT_TENURE];
  const both = t.length > 1;
  const notes = [];
  if (t.includes(90)) notes.push((both ? '90-day loans: ' : '') +
    'A renewal fee of 1% and a minimum principal payment of 10% of the original principal are due 29 and 59 days after the crediting date (Day 30 and Day 60, counting the crediting date as Day 1), with interest due on Day 60. The remaining principal and final interest are due at maturity, 90 days from the PNCM date.');
  notes.push('A maturity date that falls on a Saturday or Sunday moves to the following Monday.');
  notes.push(`A grace period of ${CFG.GRACE_BUSINESS_DAYS} business days applies to every due date, including the maturity date. Beyond it, a late fee of PHP ${CFG.LATE_FEE_PER_DAY}/day applies to unpaid renewal fees, interest and minimum principal, and a penalty of PHP ${CFG.PENALTY_PER_DAY}/day to unpaid scheduled principal, counted from the due date.`);
  notes.push('Collection fees, where charged, are listed under the billing period they relate to and are payable together with it.');
  notes.push('A billing period is settled only when its renewal fee and interest are fully paid; until then, interest and the late fee continue to accrue. Penalty fees stop once the expected principal for that period is paid. This applies even if the loan principal is paid off later.');
  notes.push('Payoff amount includes outstanding principal, unpaid charges and interest accrued to the statement date. Payments made after the statement date are not reflected.');
  return notes;
}

// ---------------------------------------------------------------- helpers (pure)
const MONTHS_ = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
const MON3_ = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/** Any date-ish value -> integer day number (UTC days since epoch), or null. */
function toDay_(v) {
  if (v == null || v === '') return null;
  if (Object.prototype.toString.call(v) === '[object Date]') {
    if (isNaN(v)) return null;
    return Math.round(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()) / 864e5);
  }
  if (typeof v === 'number') return Math.floor(v) - 25569;            // Sheets serial
  const s = String(v).trim();
  // BROWSER: the CSV feed delivers Sheets serials as text ("46319.62564"); in Apps Script they arrive as numbers
  if (/^\d+(\.\d+)?$/.test(s)) { const n = parseFloat(s); return n > 20000 && n < 60000 ? Math.floor(n) - 25569 : null; }
  let m = s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s,]+(\d{4})/);      // 25-Sep-2026
  if (m && MONTHS_[m[2].toLowerCase()] != null) return Math.round(Date.UTC(+m[3], MONTHS_[m[2].toLowerCase()], +m[1]) / 864e5);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);                              // 9/25/2026 15:00
  if (m) return Math.round(Date.UTC(+m[3], +m[1] - 1, +m[2]) / 864e5);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);                                    // 2026-09-25
  if (m) return Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 864e5);
  return null;
}
/** BROWSER: day number -> text for the patterns the statement uses (d-MMM-yyyy, d-MMM, yyyy-MM-dd). */
function fmtDate_(d, pattern) {
  const x = new Date(d * 864e5), dd = x.getUTCDate(), mm = x.getUTCMonth(), yy = x.getUTCFullYear();
  if (pattern === 'yyyy-MM-dd') return yy + '-' + String(mm + 1).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
  if (pattern === 'd-MMM') return dd + '-' + MON3_[mm];
  return dd + '-' + MON3_[mm] + '-' + yy;
}
function toNum_(v) {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v || '').replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}
function toRate_(v) {
  if (typeof v === 'number') return v > 0.5 ? v / 100 : v;
  const s = String(v || '');
  const n = toNum_(s);
  return s.includes('%') || n > 0.5 ? n / 100 : n;
}
/** Adds n business days (Mon-Fri) to day number d. */
function workday_(d, n) {
  let x = d, left = Math.max(0, Math.round(n));
  while (left > 0) { x++; const wd = new Date(x * 864e5).getUTCDay(); if (wd !== 0 && wd !== 6) left--; }
  return x;
}
/** Saturday -> Monday (+2), Sunday -> Monday (+1); weekdays unchanged. Same rule as Drawdown col BP. */
function weekendToMonday_(d) {
  const wd = new Date(d * 864e5).getUTCDay();
  return wd === 6 ? d + 2 : wd === 0 ? d + 1 : d;
}
/** First non-blank value among several possible header names (tracker headers vary). */
function pick_(tbl, row, names) {
  for (const n of names) if (tbl.has(n) && tbl.get(row, n) !== '') return tbl.get(row, n);
  return '';
}
if (typeof module !== 'undefined') module.exports = { CFG, makeTable_, buildStatement_, computeLoan_, scheduleNotes_, toDay_, fmtDate_, toNum_, toRate_, toTenure_ };

</script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   SOA GENERATOR — page logic (data load, statement document, preview, PDF, Drive repository)
   ══════════════════════════════════════════════════════════════════════ */

// Paste the Apps Script web app URL here after deploying SOA_WebApp.gs (see the setup notes).
var SOA_API = 'https://script.google.com/macros/s/AKfycbyhDt6CG98tC4YuFh3RLOIi5pz-TbDtV_tEVHpQ3vz4ws7kLYe56L3DzKxFpcVrbTnl/exec';

var DATA = null;                       // { dis, drw, rep } tables
var DEALERS = [];                      // [{ name, loans:[{id, unit}] }]
var G = { dealer: '', loan: '', asOf: '', prepared: '', note: '', busy: false };
var REPO = { rows: null, folderUrl: '', err: '', loading: false, table: null };

/* ── formatting ── */
function mny(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function dtx(d) { return d == null ? '' : fmtDate_(d, 'd-MMM-yyyy'); }
function manilaDay(date) {           // today's calendar date in Manila as yyyy-mm-dd
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila', year: 'numeric', month: '2-digit', day: '2-digit' }).format(date || new Date());
  return p;
}
function manilaStamp(date) {         // 5-Nov-2026 3:42 PM
  const o = { timeZone: 'Asia/Manila' };
  const d = new Intl.DateTimeFormat('en-GB', Object.assign({ day: 'numeric', month: 'short', year: 'numeric' }, o)).format(date).replace(/ /g, '-');
  const t = new Intl.DateTimeFormat('en-US', Object.assign({ hour: 'numeric', minute: '2-digit', hour12: true }, o)).format(date);
  return d + ' ' + t;
}

/* ══════════════ data ══════════════ */
async function loadAll() {
  const [dis, drw, rep] = await Promise.all([fetchCSV('disbursalv3.csv'), fetchCSV('drawdownv3.csv'), fetchCSV('repaymentv3.csv', true)]);
  DATA = { dis: makeTable_(dis), drw: makeTable_(drw), rep: makeTable_(rep || [['Drawdown ID']]) };
  const by = {};
  DATA.dis.rows.forEach(r => {
    const id = String(DATA.dis.get(r, 'Drawdown ID') || '').trim(), dn = String(DATA.dis.get(r, 'Dealership Name') || '').trim();
    if (!id || !dn) return;
    if (String(DATA.dis.get(r, 'Transaction Router')).trim().toLowerCase() === 'cancelled') return;
    if (toDay_(DATA.dis.get(r, 'Credit Date to Dealer Bank Account')) == null) return;     // not disbursed yet
    (by[dn] = by[dn] || []).push({ id, unit: [DATA.dis.get(r, 'Year Model'), DATA.dis.get(r, 'Make Model Variant')].filter(Boolean).join(' '), plate: String(DATA.dis.get(r, 'Plate Number') || '').trim() });
  });
  DEALERS = Object.keys(by).sort((a, b) => a.localeCompare(b)).map(n => ({ name: n, loans: by[n] }));
  G.asOf = manilaDay(new Date());
  G.prepared = (ME && ME.name) || '';
}

/* ══════════════ statement → document blocks (shared by preview and PDF) ══════════════ */
function buildDoc_(st, info) {
  const B = [], h = st.head, t = st.totals;
  B.push({ t: 'head', company: info.company || CFG.COMPANY_NAME, address: info.address || CFG.COMPANY_ADDRESS, title: 'STATEMENT OF ACCOUNT' });
  B.push({ t: 'meta', rows: [
    ['Dealership', st.dealer, 'As of', dtx(st.asOf)],
    ['Dealer / Borrower', h.dealerName || '', 'Date generated', manilaStamp(st.generated)],
    ['Dealer ID', h.dealerId || '', 'Credit Line ID', h.creditLine || ''],
    ['Type of Financing', h.financing || '', 'Loans included', String(st.loans.length)],
    ['SOA Reference No.', info.ref || '', st.onlyId ? 'Drawdown' : 'Coverage', st.onlyId || 'All open drawdowns'],
  ] });
  B.push({ t: 'section', title: 'ACCOUNT SUMMARY' });
  B.push({ t: 'summary', rows: [
    ['Original principal', t.principal], ['Outstanding principal', t.outstanding],
    ['Total amount due as of statement date', t.dueNow, true], ['   of which past due (beyond grace)', t.pastDue],
    ['Payoff amount if fully settled on statement date', t.payoff], ['Total payments received to date', t.received],
  ] });
  B.push({ t: 'section', title: 'LOANS' });
  B.push({ t: 'table', headers: ['Drawdown ID', 'Unit / Plate', 'Credit Date (Day 1)', 'Maturity (Tenure)', 'Original Principal', 'Outstanding Principal', 'Amount Due', 'Status'],
    money: [4, 5, 6], rows: st.loans.map(x => [x.loan.id, [x.loan.unit, x.loan.plate].filter(Boolean).join(' / '), dtx(x.loan.credit),
      dtx(x.maturity) + ' (' + x.loan.tenure + 'd)', x.loan.principal, x.outstanding, x.dueNow, x.status]) });

  B.push({ t: 'section', title: 'AMOUNTS DUE AS OF ' + dtx(st.asOf).toUpperCase() });
  const dl = [];
  st.loans.forEach(x => x.dueLines.forEach(l => dl.push([x.loan.id, l.cp, dtx(l.due), l.name, l.amount, l.applied, l.balance, l.status + (l.dpd ? ' (' + l.dpd + ' DPD)' : '')])));
  if (dl.length) {
    dl.push(['', '', '', 'TOTAL AMOUNT DUE', '', '', t.dueNow, '']);
    B.push({ t: 'table', headers: ['Drawdown ID', 'Checkpoint', 'Due Date', 'Particulars', 'Amount', 'Paid', 'Balance', 'Status'], money: [4, 5, 6], rows: dl, boldRows: [dl.length - 1] });
  } else B.push({ t: 'note', text: 'No amounts due as of the statement date.', italic: true });

  const nd = st.loans.filter(x => x.next || x.prev);
  if (nd.length) {
    B.push({ t: 'section', title: 'NEXT DUE (ESTIMATED IF PAID ON TIME)' });
    const rows = [], bold = [];
    nd.forEach(x => {
      const notes = [x.prev ? 'Previous: ' + x.prev.text : '', x.next && x.next.note].filter(Boolean).join('; ');
      if (!x.next) { rows.push([x.loan.id, '-', '', 'No further checkpoints', '', '', '', notes]); return; }
      x.next.lines.forEach((l, i) => rows.push([i ? '' : x.loan.id, i ? '' : x.next.cp, i ? '' : dtx(x.next.due), l.name, l.est, l.paid, l.balance, i ? '' : notes]));
      bold.push(rows.length); rows.push(['', '', '', 'Total ' + x.next.cp, '', '', x.next.total, '']);
    });
    B.push({ t: 'table', headers: ['Drawdown ID', 'Checkpoint', 'Due Date', 'Particulars', 'Est. Amount', 'Paid in Advance', 'Est. Balance', 'Notes'], money: [4, 5, 6], rows, boldRows: bold });
  }

  B.push({ t: 'section', title: 'PAYMENTS RECEIVED (UP TO STATEMENT DATE)' });
  if (st.payments.length) B.push({ t: 'table', headers: ['Payment Date', 'Drawdown ID / Type / Ref', 'Received', 'Principal', 'Interest', 'Renewal', 'Late + Penalty', 'Collection Fee'], money: [2, 3, 4, 5, 6, 7],
    rows: st.payments.map(p => [dtx(p.date), [p.id + ' / ' + p.tagLabel, p.repId].filter(Boolean).join('\n'), p.received, p.prin, p.int, p.ren, p.late + p.pen, p.coll]) });
  else B.push({ t: 'note', text: 'No payments recorded up to the statement date.', italic: true });

  if (st.graceGrants.length) {
    B.push({ t: 'section', title: 'GRACE EXTENSIONS GRANTED' });
    B.push({ t: 'table', headers: ['Recorded', 'Drawdown ID', 'Period', 'Extra Business Days'], money: [], rows: st.graceGrants.map(g => [dtx(g.date), g.id, g.tag, String(g.days)]) });
  }

  B.push({ t: 'section', title: 'NOTES' });
  scheduleNotes_(st.tenures).forEach(n => B.push({ t: 'note', text: n }));
  B.push({ t: 'pay', title: CFG.PAYMENT_TITLE, rows: CFG.PAYMENT_DETAILS });
  B.push({ t: 'note', text: 'Please indicate the Drawdown ID(s) and SOA Reference No. when remitting, and send proof of payment to your account officer.', italic: true });
  if (info.payInstr) B.push({ t: 'note', text: String(info.payInstr), bold: true });
  if (info.preparedBy) B.push({ t: 'note', text: 'Prepared by: ' + info.preparedBy });
  B.push({ t: 'note', text: 'This is a system-generated statement. Please report any discrepancy within 7 days of receipt.', italic: true, small: true });
  return B;
}

/* ══════════════ HTML preview ══════════════ */
function docHtml_(B) {
  const cell = (v, money) => money ? (v === '' || v == null ? '' : mny(v)) : esc(v).replace(/\n/g, '<br>');
  return '<div class="soa-doc">' + B.map(b => {
    if (b.t === 'head') return '<div class="sd-co">' + esc(b.company) + '</div>' + (b.address ? '<div class="sd-ad">' + esc(b.address) + '</div>' : '') + '<div class="sd-ti">' + esc(b.title) + '</div>';
    if (b.t === 'meta') return '<table class="sd-meta">' + b.rows.map(r => '<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td><th>' + esc(r[2]) + '</th><td>' + esc(r[3]) + '</td></tr>').join('') + '</table>';
    if (b.t === 'section') return '<div class="sd-sec">' + esc(b.title) + '</div>';
    if (b.t === 'summary') return '<table class="sd-sum">' + b.rows.map(r => '<tr class="' + (r[2] ? 'hl' : '') + '"><td>' + esc(r[0]).replace(/ /g, '&nbsp;') + '</td><td class="m">' + mny(r[1]) + '</td></tr>').join('') + '</table>';
    if (b.t === 'table') return '<div class="sd-tw"><table class="sd-tbl"><thead><tr>' + b.headers.map((h, i) => '<th class="' + (b.money.indexOf(i) >= 0 ? 'm' : '') + '">' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
      b.rows.map((r, ri) => '<tr class="' + ((b.boldRows || []).indexOf(ri) >= 0 ? 'bd' : '') + '">' + r.map((v, i) => '<td class="' + (b.money.indexOf(i) >= 0 ? 'm' : '') + '">' + cell(v, b.money.indexOf(i) >= 0) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';

/* ══════════════ PDF (jsPDF + autoTable) ══════════════ */
function docPdf_(B, ref) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });
  const PW = pdf.internal.pageSize.getWidth(), PH = pdf.internal.pageSize.getHeight(), M = 36, W = PW - 2 * M;
  const NAVY = [31, 56, 100], LIGHT = [232, 238, 247], GREY = [191, 191, 191];
  let y = M;
  const need = h => { if (y + h > PH - M - 18) { pdf.addPage(); y = M; } };
  const text = (s, o) => {
    o = o || {};
    pdf.setFont('helvetica', o.bold && o.italic ? 'bolditalic' : o.bold ? 'bold' : o.italic ? 'italic' : 'normal');
    pdf.setFontSize(o.size || 8.5); pdf.setTextColor.apply(pdf, o.color || [0, 0, 0]);
    const lines = pdf.splitTextToSize(String(s), W), lh = (o.size || 8.5) * 1.3;
    need(lines.length * lh);
    lines.forEach(l => { pdf.text(l, M, y + (o.size || 8.5)); y += lh; });
  };
  const money = v => (v === '' || v == null ? '' : mny(v));
  const grid = (head, body, o) => {
    o = o || {};
    const mset = new Set(o.money || []);
    const colStyles = {}; (o.money || []).forEach(i => { colStyles[i] = { halign: 'right' }; });
    pdf.autoTable({
      startY: y, margin: { left: M, right: M, bottom: M + 18 }, head: head ? [head] : undefined, body,
      theme: 'grid', styles: { font: 'helvetica', fontSize: o.fs || 7.5, cellPadding: 3, lineColor: GREY, lineWidth: o.noLine ? 0 : 0.5, textColor: [0, 0, 0], overflow: 'linebreak', valign: 'top' },
      headStyles: { fillColor: LIGHT, textColor: [0, 0, 0], fontStyle: 'bold', valign: 'middle' },
      columnStyles: Object.assign(colStyles, o.cols || {}),
      didParseCell: d => {
        if (d.section === 'head' && mset.has(d.column.index)) d.cell.styles.halign = 'right';
        if (d.section === 'body' && o.bold && o.bold.indexOf(d.row.index) >= 0) { d.cell.styles.fontStyle = 'bold'; d.cell.styles.fillColor = [247, 247, 247]; }
        if (d.section === 'body' && o.hl && o.hl.indexOf(d.row.index) >= 0) { d.cell.styles.fontStyle = 'bold'; d.cell.styles.fillColor = [255, 242, 204]; }
      },
    });
    y = pdf.lastAutoTable.finalY + 4;
  };
  B.forEach(b => {
    if (b.t === 'head') {
      text(b.company, { bold: true, size: 15, color: NAVY });
      if (b.address) text(b.address, { size: 8.5, color: [85, 85, 85] });
      y += 2; text(b.title, { bold: true, size: 13 }); y += 4;
    } else if (b.t === 'meta') {
      pdf.autoTable({ startY: y, margin: { left: M, right: M }, body: b.rows, theme: 'plain',
        styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 2.5, valign: 'middle' },
        columnStyles: { 0: { fontStyle: 'bold', cellWidth: 100 }, 1: { cellWidth: 150 }, 2: { fontStyle: 'bold', cellWidth: 90 }, 3: { cellWidth: W - 340 } } });
      y = pdf.lastAutoTable.finalY + 4;
    } else if (b.t === 'section') {
      need(60); y += 6;
      pdf.setFillColor.apply(pdf, NAVY); pdf.rect(M, y, W, 15, 'F');
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5); pdf.setTextColor(255, 255, 255); pdf.text(b.title, M + 4, y + 10.5);
      y += 19; pdf.setTextColor(0, 0, 0);
    } else if (b.t === 'summary') {
      grid(null, b.rows.map(r => [r[0], money(r[1])]), { fs: 8.5, money: [1], hl: b.rows.map((r, i) => r[2] ? i : -1).filter(i => i >= 0), cols: { 0: { cellWidth: W * 0.65 } } });
    } else if (b.t === 'table') {
      grid(b.headers, b.rows.map(r => r.map((v, i) => b.money.indexOf(i) >= 0 ? money(v) : String(v == null ? '' : v))), { money: b.money, bold: b.boldRows });
    } else if (b.t === 'note') {
      text(b.text, { italic: b.italic, bold: b.bold, size: b.small ? 7 : 8, color: b.small ? [119, 119, 119] : [0, 0, 0] }); y += 2;
    } else if (b.t === 'pay') {
      need(90); y += 4;
      pdf.autoTable({ startY: y, margin: { left: M, right: M }, head: [[{ content: b.title, colSpan: 2 }]], body: b.rows, theme: 'grid',
        styles: { font: 'helvetica', fontSize: 8, cellPadding: 3, lineColor: GREY, lineWidth: 0.5, textColor: [0, 0, 0] },
        headStyles: { fillColor: LIGHT, textColor: [0, 0, 0], fontStyle: 'bold' }, columnStyles: { 0: { fontStyle: 'bold', cellWidth: 120 } } });
      y = pdf.lastAutoTable.finalY + 6;
    }
  });
  const n = pdf.internal.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    pdf.setPage(i); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7); pdf.setTextColor(119, 119, 119);
    pdf.text('Page ' + i + ' of ' + n, PW / 2, PH - 20, { align: 'center' });
    if (ref) pdf.text(ref, M, PH - 20);
  }
  return pdf;
}
function pdfName_(ref, st) { return (ref + ' - ' + st.dealer + (st.onlyId ? ' - ' + st.onlyId : '') + ' - as of ' + fmtDate_(st.asOf, 'yyyy-MM-dd')).replace(/[\\/:*?"<>|]/g, ''); }

async function freshToken() {
  const exp = t => { const j = t && _decodeJwt(t); return j && j.exp ? j.exp * 1000 : 0; };
  if (_idToken && exp(_idToken) - Date.now() > 120000) return _idToken;
  const before = _idToken;
  try { google.accounts.id.prompt(); } catch (e) {}
  for (let i = 0; i < 40; i++) { await new Promise(r => setTimeout(r, 250)); if (_idToken && _idToken !== before && exp(_idToken) - Date.now() > 120000) return _idToken; }
  throw new Error('Your Google sign-in has expired. Reload the page and sign in again.');
}
async function soaApi(action, payload) {
  if (!SOA_API) throw new Error('The Drive connection is not set up yet (SOA_API is empty).');
  const token = await freshToken();
  const r = await fetch(SOA_API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, idToken: token }, payload || {})) });
