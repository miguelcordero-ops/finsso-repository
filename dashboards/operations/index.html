<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E8461E">
<title>Operations — Trackers Overview</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --primary:#E8461E;--accent:#F97316;--bg:#F0F4FD;--card:#FFFFFF;--card2:#F7F8FC;
  --border:rgba(0,0,0,0.09);--text:#111827;--text2:#4B5563;--text3:#8A92A0;
  --red:#DC2626;--red-bg:rgba(220,38,38,0.10);--orange:#EA580C;--orange-bg:rgba(234,88,12,0.11);
  --amber:#B45309;--amber-bg:rgba(245,158,11,0.15);--green:#15803D;--green-bg:rgba(22,163,74,0.12);
  --blue:#2563EB;--blue-bg:rgba(37,99,235,0.10);--grey-bg:rgba(107,114,128,0.12);
  --shadow:0 1px 2px rgba(0,0,0,0.05),0 4px 14px rgba(30,41,90,0.07);
  --nav-h:62px;--r:14px;
}
:root[data-theme="dark"]{
  --bg:#0B0F1A;--card:#161B29;--card2:#1C2233;--border:rgba(255,255,255,0.10);
  --text:#E5E7EB;--text2:#A1A9B8;--text3:#6B7280;
  --red:#F87171;--red-bg:rgba(248,113,113,0.14);--orange:#FB923C;--orange-bg:rgba(251,146,60,0.14);
  --amber:#FBBF24;--amber-bg:rgba(251,191,36,0.14);--green:#4ADE80;--green-bg:rgba(74,222,128,0.13);
  --blue:#60A5FA;--blue-bg:rgba(96,165,250,0.14);--grey-bg:rgba(156,163,175,0.14);
  --shadow:0 1px 2px rgba(0,0,0,0.4),0 4px 14px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}html[data-theme="dark"]{color-scheme:dark}html[data-theme="light"]{color-scheme:light}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:40px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:200;background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.brand{font-weight:700;color:var(--primary);font-size:17px;letter-spacing:-0.3px;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--text3);font-weight:500;letter-spacing:0}
.top-sp{flex:1}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.who-txt{line-height:1.2;min-width:0}.who-txt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}.who-txt span{font-size:11px;color:var(--text3)}
.icon-btn{border:1px solid var(--border);background:var(--card2);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--text2)}
.lens{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media(max-width:700px){
  .topbar{flex-wrap:wrap;row-gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
  .who-txt{display:none}
  .lens{order:5;width:100%}
  .lens:empty{display:none}
  .brand{font-size:16px}
  .main{padding:12px}
}

/* ── navigation: top tabs on laptop, bottom bar on phone ── */
.nav{display:flex;gap:4px;position:fixed;left:0;right:0;bottom:0;z-index:250;background:var(--card);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,0.08)}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:5px 2px;border-radius:10px;color:var(--text3);min-height:46px;font-weight:600}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--primary);background:rgba(232,70,30,0.09)}
.nav button.hide{display:none}
.nav .fab{color:#fff;background:linear-gradient(135deg,var(--accent),var(--primary));margin:-14px 4px 0;border-radius:16px;box-shadow:0 6px 16px rgba(232,70,30,0.35);flex:1.15}
.nav .fab.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--primary))}
@media(min-width:900px){
  body{padding-bottom:30px}
  .nav{position:sticky;top:55px;bottom:auto;border-top:0;border-bottom:1px solid var(--border);box-shadow:none;padding:0 16px;gap:2px;justify-content:flex-start;z-index:190}
  .nav button{flex:none;flex-direction:row;gap:7px;font-size:13px;padding:11px 16px;border-radius:0;border-bottom:3px solid transparent;min-height:0}
  .nav button.on{background:none;border-bottom-color:var(--primary)}
  .nav .fab{margin:6px 0 6px 10px;border-radius:10px;padding:7px 16px;border-bottom:0;flex:none}
  .nav .fab.on{border-bottom:0}
}

/* ── layout ── */
.main{max-width:1180px;margin:0 auto;padding:16px}
.h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}.sub{color:var(--text3);font-size:12.5px;margin-top:2px}
.sec{margin-top:20px}.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}.sec-h h2{font-size:15px;font-weight:700}.sec-h .sub{margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;text-align:left;cursor:pointer;display:block;width:100%}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-0.5px;line-height:1.1}.kpi .l{font-size:11.5px;color:var(--text2);margin-top:3px;font-weight:600}.kpi .s{font-size:10.5px;color:var(--text3);margin-top:1px}
.kpi.red .n{color:var(--red)}.kpi.orange .n{color:var(--orange)}.kpi.amber .n{color:var(--amber)}.kpi.green .n{color:var(--green)}.kpi.blue .n{color:var(--blue)}
.two{display:grid;gap:14px}@media(min-width:900px){.two{grid-template-columns:1.5fr 1fr}}
.cols3{display:grid;gap:12px}@media(min-width:760px){.cols3{grid-template-columns:repeat(2,1fr)}}@media(min-width:1100px){.cols3{grid-template-columns:repeat(3,1fr)}}

/* ── pills / chips / buttons ── */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-crit{background:var(--red);color:#fff}.p-high{background:var(--orange-bg);color:var(--orange)}.p-soon{background:var(--amber-bg);color:var(--amber)}.p-ok{background:var(--grey-bg);color:var(--text2)}
.t-red{background:var(--red-bg);color:var(--red)}.t-orange{background:var(--orange-bg);color:var(--orange)}.t-green{background:var(--green-bg);color:var(--green)}.t-blue{background:var(--blue-bg);color:var(--blue)}.t-grey{background:var(--grey-bg);color:var(--text2)}.t-amber{background:var(--amber-bg);color:var(--amber)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--text2);min-height:34px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--primary);color:#fff}
.btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--primary));border-color:transparent;color:#fff}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12px;border-radius:8px}
.btn.ghost{background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.search{width:100%;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px 12px;min-height:42px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.toolbar .search{flex:1;min-width:180px}
.empty{padding:30px 14px;text-align:center;color:var(--text3)}
.muted{color:var(--text3)}.small{font-size:12px}.b{font-weight:700}

/* ── work items ── */
.item{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--grey-bg);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.item.crit{border-left-color:var(--red)}.item.high{border-left-color:var(--orange)}.item.soon{border-left-color:var(--amber)}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item-t{font-weight:700;font-size:14px}.item-s{font-size:12px;color:var(--text2)}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.list{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.dcard-h{padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.dcard-body[hidden]{display:none}
.dcard-body{border-top:1px solid var(--border);background:var(--card2);padding:10px;display:flex;flex-direction:column;gap:8px}
.dcard .addr{font-size:12px;color:var(--text2)}
.dd-mini{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--grey-bg);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.dd-mini.crit{border-left-color:var(--red)}.dd-mini.high{border-left-color:var(--orange)}.dd-mini.soon{border-left-color:var(--amber)}
.stopno{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.bar{height:8px;border-radius:99px;background:var(--grey-bg);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:99px}

/* ── data table (every column filterable) ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 230px);-webkit-overflow-scrolling:touch}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.dt th{position:sticky;top:0;z-index:3;background:var(--card2);text-align:left;padding:0;border-bottom:1px solid var(--border);white-space:nowrap}
.dt th .th{display:flex;align-items:center;gap:4px;padding:9px 8px 9px 10px;font-weight:700;font-size:11.5px;color:var(--text2)}
.dt th .th span{flex:1;cursor:pointer;user-select:none}
.fbtn{border:0;background:none;padding:3px 5px;border-radius:6px;color:var(--text3);font-size:11px}
.fbtn.on{background:var(--primary);color:#fff}
.dt td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card)}
.dt tr:hover td{background:var(--card2)}
.dt td.fz,.dt th.fz{position:sticky;left:0;z-index:4;box-shadow:2px 0 0 var(--border)}
.dt th.fz{z-index:6}
.dt td.num,.dt th.num .th{text-align:right;justify-content:flex-end}
.dt td.click{cursor:pointer}
.fpanel{position:fixed;z-index:1200;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,0.25);width:290px;max-width:calc(100vw - 20px);max-height:70vh;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.fpanel .row{display:flex;gap:6px}.fpanel button.o{flex:1;border:1px solid var(--border);background:var(--card2);border-radius:8px;padding:7px;font-size:12px;font-weight:600}
.fpanel input[type=text],.fpanel select{width:100%;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:8px}
.fpanel .vals{max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:4px}
.fpanel label{display:flex;gap:8px;align-items:center;padding:5px 6px;font-size:12.5px;border-radius:6px}
.fpanel label:hover{background:var(--card2)}
.fpanel h6{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:700px){.fpanel{left:8px!important;right:8px;bottom:8px;top:auto!important;width:auto;max-height:78vh}}

/* ── sheet / modal ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:900;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,0.3)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-size:16px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin:10px 0}
.kv div{font-size:12.5px}.kv span{display:block;font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:8px}.tl .e{border-left:3px solid var(--grey-bg);padding:2px 0 2px 10px;font-size:12.5px}.tl .e.f{border-left-color:var(--red)}.tl .e.p{border-left-color:var(--green)}

/* ── form ── */
.form{display:flex;flex-direction:column;gap:14px;max-width:720px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld>.lab{font-size:12px;font-weight:700;color:var(--text2)}
.fld .req{color:var(--red)}
.inp{width:100%;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:11px 12px;min-height:46px;font-size:15px}
textarea.inp{min-height:84px;resize:vertical}
.inp[readonly]{background:var(--card2);color:var(--text2)}
.hint{font-size:11.5px;color:var(--text3)}
.bigseg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigseg button{border:2px solid var(--border);background:var(--card);border-radius:12px;padding:14px;font-weight:800;font-size:16px}
.bigseg button.on.pass{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.bigseg button.on.fail{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.ph img{width:100%;height:100%;object-fit:cover}.ph button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;width:22px;height:22px;border-radius:50%;font-size:13px;line-height:1}
.addph{width:76px;height:76px;border-radius:10px;border:2px dashed var(--border);background:var(--card2);color:var(--text2);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.callout{border-radius:12px;padding:10px 12px;font-size:12.5px}
.callout.warn{background:var(--amber-bg);color:var(--amber)}.callout.bad{background:var(--red-bg);color:var(--red)}.callout.good{background:var(--green-bg);color:var(--green)}.callout.info{background:var(--blue-bg);color:var(--blue)}
.stickyact{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);display:flex;gap:10px;padding:10px 0;background:linear-gradient(to top,var(--bg) 70%,transparent)}
@media(min-width:900px){.stickyact{bottom:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:2000;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:90vw}
.toast.err{background:var(--red)}
.spin{width:18px;height:18px;border:3px solid var(--grey-bg);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:70px 20px;color:var(--text3)}

/* ── lock ── */
.lock-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .35s}
.lock-overlay.unlocking{opacity:0;pointer-events:none}.lock-overlay.hidden{display:none}
.lock-card{background:var(--card);border:1px solid var(--border);box-shadow:0 30px 80px rgba(30,41,90,0.2);border-radius:26px;padding:34px 30px 26px;width:360px;max-width:92vw;display:flex;flex-direction:column;align-items:center}
.lock-icon-box{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--primary));box-shadow:0 4px 16px rgba(232,70,30,0.30);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.lock-icon-box svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lock-title{font-size:18px;font-weight:700;margin-bottom:6px;text-align:center}.lock-sub{font-size:12.5px;color:var(--text3);margin-bottom:20px;text-align:center;line-height:1.6}
.lock-signin{min-height:44px;display:flex;justify-content:center}.lock-error-msg{font-size:12px;color:var(--red);margin-top:10px;min-height:16px;text-align:center}
.lock-contact{font-size:11px;color:var(--text3);text-align:center;margin-top:14px}.lock-contact a{color:var(--primary);text-decoration:underline}

/* ── credit dashboard additions ── */
.main{max-width:1320px}
.srch{position:relative;flex:1;min-width:240px}
.srch .res{position:absolute;left:0;right:0;top:46px;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.22);max-height:60vh;overflow:auto}
.srch .res .r{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.srch .res .r:hover,.srch .res .r.hi{background:var(--card2)}
.srch .res .r:last-child{border-bottom:0}
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.hero h1{font-size:22px;letter-spacing:-.4px}
.rating{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;font-weight:800;font-size:14px}
.rating small{font-weight:600;font-size:11px;opacity:.85;display:block}
.r-red{background:var(--red-bg);color:var(--red)}.r-amber{background:var(--amber-bg);color:var(--amber)}.r-green{background:var(--green-bg);color:var(--green)}.r-grey{background:var(--grey-bg);color:var(--text2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:16px 0 14px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:13px;color:var(--text3);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.flags{display:grid;gap:8px}
@media(min-width:900px){.flags{grid-template-columns:repeat(2,1fr)}}
.flag{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;border:1px solid var(--border);background:var(--card)}
.flag .ic{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;margin-top:1px}
.flag.red{background:var(--red-bg);border-color:transparent}.flag.red .ic{background:var(--red)}
.flag.amber{background:var(--amber-bg);border-color:transparent}.flag.amber .ic{background:#D97706}
.flag.green{background:var(--green-bg);border-color:transparent}.flag.green .ic{background:#16A34A}
.flag.info .ic{background:var(--text3)}
.flag b{display:block;font-size:13px}.flag span{font-size:12px;color:var(--text2)}
.ckpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.ckpis{grid-template-columns:repeat(4,1fr)}}

<script>
var DATA_BASE = 'https://raw.githubusercontent.com/miguelcordero-ops/finsso-repository/main/data/';
var GOOGLE_CLIENT_ID = '263530903165-4nv0iueb5ftb5hjevr14mqug3rlraav5.apps.googleusercontent.com';
var ALLOWLIST_API = 'https://script.google.com/a/macros/finsso.com/s/AKfycbznI2kQ8a0ApTS9xbDjY4oLoya5KQlqJ-xHm4X75BwkgIby4Cfqtz2xCupYOeFMBFik/exec';
var ALLOWLIST_TAB = 'Operations';   // value to put in column B ("Dashboards") of the shared Allowlist tab
var DAY_MS = 86400000;
var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var ME = null;
var S = { tab: 'overview', prod: 'all', fin: 'all' };
function parseSheetDate(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) {
    const serial = Math.floor(parseFloat(s));
    if (serial < 20000 || serial > 60000) return null;
    const utcMs = Math.round((serial - 25569) * DAY_MS);
    const utcDate = new Date(utcMs);
    return new Date(utcDate.getUTCFullYear(), utcDate.getUTCMonth(), utcDate.getUTCDate());
  }
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2]);
  const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (iso) return new Date(+iso[1], +iso[2]-1, +iso[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function parseNum(v) {
  if (v === null || v === undefined || v === '') return 0;
  const s = String(v).replace(/[,₱%]/g,'').trim();
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (ch === '"') inQ = false;
      else field += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\r') { /* skip */ }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
}
// Columns are ALWAYS looked up by header name, never by position — the sheet
// can gain or lose columns at any time. Header text is whitespace-normalized
// on both sides (some headers carry doubled spaces, NBSPs or embedded
// newlines, e.g. "R2  Payment Status", "Plate Number\n(as on ORCR)").
function normHeader(h) { return String(h == null ? '' : h).replace(/[\s\u00a0]+/g, ' ').trim(); }
function buildColumnMap(headerRow) {
  const idx = {};
  headerRow.forEach((h, i) => { const key = normHeader(h); if (key && !(key in idx)) idx[key] = i; });
  return function (name) { const k = normHeader(name); return idx[k] !== undefined ? idx[k] : -1; };
}
function get(row, i) { return i >= 0 && i < row.length ? row[i] : ''; }
// Normalizes a person-name field for matching: Google Sheets sometimes stores
// a non-breaking space (U+00A0) instead of a regular space between a first
// and last name (seen in real data as "Ricmar Magboo"), and typed sheets
// like "[Raw] Mapping" use a plain space for the same name — without this,
// those two strings don't compare equal and the SO silently falls out of
// every team total. Collapses any run of whitespace (regular or NBSP) to a
// single regular space, so the two representations always match.
function normName(s) { return String(s || '').replace(/[\s ]+/g, ' ').trim(); }

async function fetchCSV(name, optional) {
  const url = DATA_BASE + name + '?_=' + Date.now();
  const r = await fetch(url);
  if (!r.ok) {
    if (optional) return null; // e.g. a new export not deployed yet — degrade gracefully
    throw new Error('Failed to load ' + name + ' (HTTP ' + r.status + ')');
  }
  return parseCSV(await r.text());
}


/* ══════════════════════════════════════════════════
   small utilities
══════════════════════════════════════════════════ */
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sod(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
var TODAY = sod(new Date());
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function diffDays(a, b) { return Math.round((sod(a) - sod(b)) / DAY_MS); }
function fmtD(d) { return d ? String(d.getDate()).padStart(2, '0') + ' ' + MONTH_ABBR[d.getMonth()] + ' ' + d.getFullYear() : '—'; }
function fmtDs(d) { return d ? String(d.getDate()).padStart(2, '0') + ' ' + MONTH_ABBR[d.getMonth()] : '—'; }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function peso(n) { return '₱' + Math.round(n || 0).toLocaleString('en-US'); }
function pct(a, b) { return b ? Math.round(a / b * 100) + '%' : '—'; }
function mkey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function uid8() { const a = new Uint8Array(4); crypto.getRandomValues(a); return Array.from(a, x => x.toString(16).padStart(2, '0')).join(''); }
function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3200); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function initials(n) { return String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join('') || '?'; }


/* ══════════════════════════════════════════════════
   DATA TABLE — a filter dropdown on EVERY column
   (sort A→Z / Z→A, filter by condition, filter by values with checkboxes)
══════════════════════════════════════════════════ */
function makeTable(host, cols, rows, o) {
  o = o || {};
  const st = { f: {}, sort: o.sort || null, panel: null };
  let cur = [];
  const txt = (c, r) => { const v = c.txt ? c.txt(r) : c.val(r); return v == null || v === '' ? '(blank)' : String(v); };
  const raw = (c, r) => { const v = c.val(r); return v instanceof Date ? v.getTime() : v; };
  function cond(c, f, r) {
    const v = raw(c, r), q = f.v;
    if (f.op === 'empty') return v === '' || v == null || v === 0 && c.type !== 'num';
    if (f.op === 'nempty') return !(v === '' || v == null);
    if (c.type === 'num' || c.type === 'date') {
      const n = c.type === 'date' ? (q ? new Date(q + 'T00:00:00').getTime() : NaN) : parseFloat(q);
      if (isNaN(n)) return true; const x = Number(v);
      return f.op === 'eq' ? x === n : f.op === 'gt' ? x > n : f.op === 'lt' ? x < n : f.op === 'gte' ? x >= n : x <= n;
    }
    const s = String(v == null ? '' : v).toLowerCase(), t = String(q || '').toLowerCase();
    return f.op === 'contains' ? s.includes(t) : f.op === 'ncontains' ? !s.includes(t) : f.op === 'eq' ? s === t : s.startsWith(t);
  }
  function pass(r) {
    for (const c of cols) { const f = st.f[c.id]; if (!f) continue;
      if (f.sel && !f.sel.has(txt(c, r))) return false;
      if (f.op && !cond(c, f, r)) return false; }
    return true;
  }
  function viewRows() {
    let r = rows.filter(pass);
    if (st.sort) { const c = cols.find(x => x.id === st.sort.id), dir = st.sort.dir;
      r = r.slice().sort((a, b) => { let x = raw(c, a), y = raw(c, b);
        if (x == null || x === '') return 1; if (y == null || y === '') return -1;
        return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true })) * dir; }); }
    return r;
  }
  const active = id => { const f = st.f[id]; return !!f && (!!f.sel || !!f.op); };
  function render() {
    cur = viewRows();
    const nF = Object.keys(st.f).filter(active).length;
    let h = '<div class="toolbar" style="margin:0 0 8px"><span class="small muted">' + cur.length.toLocaleString() + ' of ' + rows.length.toLocaleString() + ' rows' + (nF ? ' · ' + nF + ' filter' + (nF > 1 ? 's' : '') : '') + '</span>' +
      (nF || st.sort ? '<button class="btn sm ghost" data-t="clear">Clear filters &amp; sort</button>' : '') + '<span style="flex:1"></span>' + (o.csv ? '<button class="btn sm" data-t="csv">Export CSV</button>' : '') + '</div>';
    h += '<div class="tbl-wrap"' + (o.maxH ? ' style="max-height:' + o.maxH + '"' : '') + '><table class="dt"><thead><tr>';
    cols.forEach(c => { const srt = st.sort && st.sort.id === c.id ? (st.sort.dir > 0 ? ' ▲' : ' ▼') : '';
      h += '<th class="' + (c.fz ? 'fz ' : '') + (c.type === 'num' ? 'num' : '') + '"><div class="th"><span data-t="sort" data-c="' + c.id + '">' + esc(c.label) + srt + '</span><button class="fbtn' + (active(c.id) ? ' on' : '') + '" data-t="f" data-c="' + c.id + '" title="Filter">▾</button></div></th>'; });
    h += '</tr></thead><tbody>';
    const MAX = 800;
    cur.slice(0, MAX).forEach((r, i) => { h += '<tr data-i="' + i + '">';
      cols.forEach(c => { h += '<td class="' + (c.fz ? 'fz ' : '') + (c.type === 'num' ? 'num ' : '') + (o.onRow ? 'click' : '') + '">' + (c.html ? c.html(r) : esc(c.txt ? c.txt(r) : (c.val(r) instanceof Date ? fmtD(c.val(r)) : c.val(r)))) + '</td>'; });
      h += '</tr>'; });
    if (!cur.length) h += '<tr><td colspan="' + cols.length + '" class="empty">No rows match these filters.</td></tr>';
    h += '</tbody></table></div>';
    if (cur.length > MAX) h += '<div class="small muted" style="margin-top:6px">Showing the first ' + MAX + ' rows — narrow with filters to see the rest.</div>';
    host.innerHTML = h;
  }
  function closePanel() { if (st.panel) { st.panel.remove(); st.panel = null; document.removeEventListener('mousedown', outside, true); } }
  function outside(e) { if (st.panel && !st.panel.contains(e.target) && !(e.target.closest && e.target.closest('.fbtn'))) closePanel(); }
  function openPanel(id, anchor) {
    closePanel();
    const c = cols.find(x => x.id === id), f = st.f[id] || (st.f[id] = {});
    const p = document.createElement('div'); p.className = 'fpanel';
    const ops = c.type === 'num' ? [['eq', '='], ['gt', '>'], ['gte', '≥'], ['lt', '<'], ['lte', '≤']] : c.type === 'date' ? [['eq', 'Is on'], ['gt', 'After'], ['lt', 'Before'], ['gte', 'On or after'], ['lte', 'On or before']] : [['contains', 'Contains'], ['ncontains', 'Does not contain'], ['eq', 'Is exactly'], ['starts', 'Starts with']];
    const vals = {}; rows.forEach(r => { const t = txt(c, r); vals[t] = (vals[t] || 0) + 1; });
    const keys = Object.keys(vals).sort((a, b) => c.type === 'num' ? parseFloat(a) - parseFloat(b) : a.localeCompare(b, undefined, { numeric: true }));
    p.innerHTML = '<div class="row"><button class="o" data-s="asc">Sort A → Z</button><button class="o" data-s="desc">Sort Z → A</button></div>' +
      '<h6>Filter by condition</h6><select data-k="op"><option value="">None</option>' + ops.concat([['empty', 'Is empty'], ['nempty', 'Is not empty']]).map(x => '<option value="' + x[0] + '"' + (f.op === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select>' +
      '<input type="' + (c.type === 'date' ? 'date' : 'text') + '" data-k="v" placeholder="Value" value="' + esc(f.v || '') + '">' +
      '<h6>Filter by values</h6><input type="text" data-k="q" placeholder="Search values…"><div class="row"><button class="o" data-s="all">Select all</button><button class="o" data-s="none">Clear</button></div><div class="vals" data-k="list"></div>' +
      '<div class="row"><button class="o" data-s="reset">Reset column</button><button class="o" data-s="done" style="background:var(--primary);color:#fff;border-color:var(--primary)">Done</button></div>';
    const list = p.querySelector('[data-k=list]');
    const draw = () => { const q = p.querySelector('[data-k=q]').value.toLowerCase(); const sel = f.sel;
      list.innerHTML = keys.filter(k => !q || k.toLowerCase().includes(q)).slice(0, 400).map(k => '<label><input type="checkbox" data-v="' + esc(k) + '"' + (!sel || sel.has(k) ? ' checked' : '') + '>' + esc(k) + ' <span class="muted small">(' + vals[k] + ')</span></label>').join('') || '<div class="empty small">No values</div>'; };
    draw();
    p.addEventListener('input', e => {
      if (e.target.dataset.k === 'q') draw();
      else if (e.target.dataset.k === 'v') { f.v = e.target.value; render(); }
    });
    p.addEventListener('change', e => {
      if (e.target.dataset.k === 'op') { f.op = e.target.value || undefined; render(); }
      else if (e.target.dataset.v !== undefined) {
        if (!f.sel) f.sel = new Set(keys);
        e.target.checked ? f.sel.add(e.target.dataset.v) : f.sel.delete(e.target.dataset.v);
        if (f.sel.size === keys.length) f.sel = undefined; render();
      }
    });
    p.addEventListener('click', e => {
      const s = e.target.dataset.s; if (!s) return;
      if (s === 'asc' || s === 'desc') { st.sort = { id, dir: s === 'asc' ? 1 : -1 }; render(); closePanel(); }
      else if (s === 'all') { f.sel = undefined; draw(); render(); }
      else if (s === 'none') { f.sel = new Set(); draw(); render(); }
      else if (s === 'reset') { delete st.f[id]; render(); closePanel(); }
      else if (s === 'done') closePanel();
    });
    document.body.appendChild(p); st.panel = p;
    const b = anchor.getBoundingClientRect();
    if (window.innerWidth > 700) { p.style.top = Math.min(b.bottom + 4, window.innerHeight - 340) + 'px'; p.style.left = Math.max(8, Math.min(b.left - 200, window.innerWidth - 300)) + 'px'; }
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
  }
  host.onclick = function (e) {
    const t = e.target.closest('[data-t]');
    if (t) {
      const k = t.dataset.t;
      if (k === 'sort') { const id = t.dataset.c; st.sort = st.sort && st.sort.id === id ? (st.sort.dir > 0 ? { id, dir: -1 } : null) : { id, dir: 1 }; render(); }
      else if (k === 'f') openPanel(t.dataset.c, t);
      else if (k === 'clear') { st.f = {}; st.sort = null; render(); }
      else if (k === 'csv') exportCsv();
      return;
    }
    const tr = e.target.closest('tr[data-i]');
    if (tr && o.onRow) o.onRow(cur[+tr.dataset.i]);
  };
  function exportCsv() {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [cols.map(c => q(c.label)).join(',')].concat(cur.map(r => cols.map(c => { const v = c.val(r); return q(v instanceof Date ? iso(v) : (c.txt && c.type !== 'num' ? c.txt(r) : v)); }).join(',')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = (o.csv || 'export') + '.csv'; a.click();
  }

}

/* ══════════════════════════════════════════════════
   sheets (modal) + shared bits
══════════════════════════════════════════════════ */
function openSheet(html) {
  closeSheet();
  const r = document.getElementById('overlay-root');
  r.innerHTML = '<div class="scrim" id="scrim"><div class="sheet" id="sheet">' + html + '</div></div>';
  document.getElementById('scrim').addEventListener('mousedown', e => { if (e.target.id === 'scrim') closeSheet(); });
  return document.getElementById('sheet');
}
function closeSheet() { document.getElementById('overlay-root').innerHTML = ''; }
/* ══════════════════════════════════════════════════
   DATA — drawdown / disbursal / repayment trackers (v2 + v3)
   Every column is looked up by HEADER NAME, never by position.
══════════════════════════════════════════════════ */
var LOANS = [], LMAP = {}, DISB = [], PAYS = [], EXC = [], PBY = {}, DBY = {};
var OPEN_RE = /^(open|overdue|restructuring active|restructuring pending)$/i;
var LOOKBACK = 120;            // pending-stage logic only looks at recent records; older gaps are historic data, not live work
var SLA = { endorse: 2, nbDisb: 5, receipt: 2, remit: 3 };   // business-ish days before a pending item turns amber (×2 = red)

function pdt(v) {              // like parseSheetDate but keeps the time of day on serial numbers
  if (v == null) return null; const s = String(v).trim(); if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) {
    const n = parseFloat(s); if (n < 20000 || n > 60000) return null;
    const u = new Date(Math.round((n - 25569) * DAY_MS));
    return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes(), u.getUTCSeconds());
  }
  return parseSheetDate(s);
}
function T(grid) {
  const c = buildColumnMap(grid[0]);
  const hdr = grid[0].map(normHeader);
  return {
    rows: grid.slice(1), c,
    g: (r, n) => String(get(r, c(n))).trim(),
    n: (r, n) => parseNum(get(r, c(n))),
    d: (r, n) => pdt(get(r, c(n))),
    like: (r, prefix) => { const i = hdr.findIndex(h => h.toLowerCase().indexOf(prefix.toLowerCase()) === 0); return i >= 0 ? String(get(r, i)).trim() : ''; }
  };
}
function normStatus(s) { s = String(s || '').trim(); return s.toLowerCase() === 'cancelled' ? 'Cancelled' : s; }
function baseId(id) { return String(id || '').replace(/\*/g, '').trim().toUpperCase(); }

  return rows.map(r => '<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px"><span><b>' + esc(r.label) + '</b>' + (r.sub ? ' <span class="muted small">' + esc(r.sub) + '</span>' : '') + '</span><span>' + fmt(r) + '</span></div><div class="bar" style="margin-top:4px"><i style="width:' + Math.max(r.v ? 2 : 0, r.v / mx * 100) + '%' + (r.col ? ';background:' + r.col : '') + '"></i></div></div>').join('');
}

/* ── metrics shared by several tabs ── */
function metrics() {
  const L = LOANS.filter(pf), A = L.filter(l => l.active), OD = A.filter(l => l.overdue), R = mtdRange();
  const live = L.filter(l => !/cancel/i.test(l.status));
  const P = PAYS.filter(pf), D = DISB.filter(pf);
  const m = {
    L, A, OD, aum: sum(A, l => l.out), odOut: sum(OD, l => l.out),
    dMtd: live.filter(l => inRange(l.cd, R.s, R.e)), dLm: live.filter(l => inRange(l.cd, R.ps, R.pe)),
    pMtd: P.filter(p => inRange(p.date, R.s, R.e)), pLm: P.filter(p => inRange(p.date, R.ps, R.pe)),
    pendD: D.filter(d => d.pending), pendR: P.filter(isPendingRemit), R
  };
  m.dMtdAmt = sum(m.dMtd, l => l.orig); m.dLmAmt = sum(m.dLm, l => l.orig);
  m.cMtd = sum(m.pMtd, p => p.recv); m.cLm = sum(m.pLm, p => p.recv);
  const wk = addDays(TODAY, 7); m.due7 = []; A.forEach(l => l.dues.forEach(d => { if (d.kind === 'upcoming' && d.date >= TODAY && d.date <= wk) m.due7.push({ l, d }); }));
  m.exc = EXC.filter(pf); m.excRed = m.exc.filter(e => e.sev === 'red').length; m.excAmb = m.exc.length - m.excRed;
  return m;
}
function outAt(l, T) {          // outstanding principal at date T, rebuilt from credit date and principal repaid
  if (!l.cd || l.cd > T) return 0;
  if (!(l.active || l.repo) && T >= (l.settled || l.lastPay || l.cd)) return 0;      // closed loans drop out when settled
  const paid = (PBY[baseId(l.id)] || []).reduce((s, p) => s + (p.date <= T ? p.prin : 0), 0);
  return Math.max(0, l.orig - paid);
}
function series12() {
  const M = months(12), L = LOANS.filter(pf).filter(l => !/cancel/i.test(l.status)), P = PAYS.filter(pf);
  return M.map((mo, i) => {
    const cur = i === M.length - 1; let aum = 0;
    L.forEach(l => { aum += outAt(l, mo.end); });
    const dl = L.filter(l => inRange(l.cd, mo.start, mo.end)), pm = P.filter(p => inRange(p.date, mo.start, mo.end));
    return { label: mo.label, cur, aum, disb: sum(dl, l => l.orig), nDisb: dl.length, coll: sum(pm, p => p.recv), nPay: pm.length, prin: sum(pm, p => p.prin) };
  });
}

      { id: 'c-prin', ser: se.map(s => ({ label: s.label, v: s.prin, cur: s.cur })), fmt: s => peso(s.v) },
      { id: 'c-n', ser: se.map(s => ({ label: s.label, v: s.nPay, cur: s.cur })), fmt: s => s.v + ' payments' }]);
    let rows = P; if (S.py === '30d') rows = p30; else if (S.py === 'mtd') rows = m.pMtd; else if (S.py === 'pending') rows = m.pendR;
    TABLES.pays = makeTable(document.getElementById('t-pays'), [
      { id: 'dt', label: 'Payment date', val: p => p.date, type: 'date', fz: 1 }, { id: 'id', label: 'Drawdown ID', val: p => p.ld }, { id: 'dl', label: 'Dealer', val: p => p.dealer }, { id: 'pr', label: 'Product', val: p => p.prod },
      { id: 'fn', label: 'Financier', val: p => p.fin }, { id: 'ty', label: 'Payment type', val: p => p.type || '—' }, { id: 'md', label: 'Mode', val: p => p.mode || '—' },
      { id: 'rc', label: 'Received', val: p => p.recv, txt: p => peso(p.recv), type: 'num' }, { id: 'pn', label: 'Principal', val: p => p.prin, txt: p => peso(p.prin), type: 'num' }, { id: 'in', label: 'Interest', val: p => p.int, txt: p => peso(p.int), type: 'num' },
      { id: 'fe', label: 'Fees &amp; penalty', val: p => p.fee + p.pen, txt: p => peso(p.fee + p.pen), type: 'num' }, { id: 'cr', label: 'Credited to bank', val: p => p.cred, type: 'date' },
      { id: 'rm', label: 'Remitted to Netbank', val: p => p.rem, type: 'date', html: p => p.rem ? fmtD(p.rem) : isPendingRemit(p) ? pill('t-amber', 'Pending ' + diffDays(TODAY, p.cred || p.date) + 'd') : '<span class="muted">—</span>' },
      { id: 'lg', label: 'Remittance lag (days)', val: p => p.lag, type: 'num' }, { id: 'ex', label: 'Lacking / excess', val: p => p.excess, txt: p => Math.abs(p.excess) > 1 ? (p.excess < 0 ? 'Lacking ' : 'Excess ') + peso(Math.abs(p.excess)) : '—', type: 'num' }
    ], rows, { sort: { id: 'dt', dir: -1 }, onRow: p => { if (findLoan(p.ld)) showLoan(p.ld); }, csv: 'repayment-tracker', maxH: '620px' });
  } };
}

/* ══════════════════════════════════════════════════
   EXCEPTIONS
══════════════════════════════════════════════════ */
function excTab() {
  const E = EXC.filter(pf), cats = {}; E.forEach(e => { const c = cats[e.cat] || (cats[e.cat] = { n: 0, red: 0, src: e.src }); c.n++; if (e.sev === 'red') c.red++; });
  const names = Object.keys(cats).sort((a, b) => cats[b].red - cats[a].red || cats[b].n - cats[a].n);
  let h = '<div class="sec-h"><h2>Exceptions &amp; data-quality checks</h2><span class="sub">Rule-based from the three trackers · urgent = past twice the allowed time or a hard error</span></div>';
  if (!E.length) return { html: h + '<div class="card empty">No exceptions — everything checks out.</div>', after() {} };
  h += '<div class="chips" style="margin-bottom:12px"><button class="chip' + (S.ex === 'all' ? ' on' : '') + '" data-act="ex" data-v="all">All (' + E.length + ')</button>' +
    names.map(n => '<button class="chip' + (S.ex === n ? ' on' : '') + '" data-act="ex" data-v="' + esc(n) + '">' + esc(n) + ' (' + cats[n].n + ')' + (cats[n].red ? ' · ' + cats[n].red + ' urgent' : '') + '</button>').join('') + '</div><div class="card" id="t-exc"></div>';
  return { html: h, after() {
    const rows = S.ex === 'all' ? E : E.filter(e => e.cat === S.ex);
    TABLES.exc = makeTable(document.getElementById('t-exc'), [
      { id: 'sv', label: 'Priority', val: e => e.sev === 'red' ? 'Urgent' : 'Review', html: e => pill(e.sev === 'red' ? 't-red' : 't-amber', e.sev === 'red' ? 'Urgent' : 'Review'), fz: 1 },
      { id: 'ct', label: 'Issue', val: e => e.cat }, { id: 'sr', label: 'Tracker', val: e => e.src }, { id: 'rf', label: 'Reference', val: e => e.ref }, { id: 'dl', label: 'Dealer', val: e => e.dealer },
      { id: 'dt', label: 'Detail', val: e => e.detail }, { id: 'ag', label: 'Age (days)', val: e => e.age, type: 'num' }, { id: 'am', label: 'Amount', val: e => e.amt, txt: e => e.amt ? peso(e.amt) : '—', type: 'num' },
      { id: 'fx', label: 'What to do', val: e => e.fix }, { id: 'pr', label: 'Product', val: e => e.prod }
    ], rows, { onRow: e => { if (findLoan(e.ref) || DBY[baseId(e.ref)]) showLoan(findLoan(e.ref) ? findLoan(e.ref).id : e.ref); }, csv: 'operations-exceptions', maxH: '640px' });
  } };
}

/* ══════════════════════════════════════════════════
   LOAN POP-UP
══════════════════════════════════════════════════ */
function showLoan(id) {
  const l = findLoan(id), d = DBY[baseId(id)]; if (!l && !d) return;
  const tb = (head, body) => '<table class="dt" style="margin:6px 0 10px"><thead><tr>' + head.map(x => '<th><div class="th"><span>' + x + '</span></div></th>').join('') + '</tr></thead><tbody>' + body + '</tbody></table>';
  const kv = pairs => '<div class="kv">' + pairs.map(p => '<div><span>' + p[0] + '</span>' + p[1] + '</div>').join('') + '</div>';
  const dtm = x => x ? fmtD(x) + (x.getHours() || x.getMinutes() ? ' ' + String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0') : '') : '—';
  let h = '<h3>' + esc((l || d).id) + ' · ' + esc((l || d).dealer) + '</h3><div class="sub">' + (l ? esc(l.unit) + ' · ' + esc(l.plate) + ' · ' : '') + esc((l || d).fin) + ' · ' + (l || d).prod + '</div>';
  if (l) {
    h += '<div class="chips" style="margin:8px 0">' + statusPill(l) + (l.overdue ? pill('t-red', 'Overdue') : '') + (l.stale ? '<span class="small muted"> tracker says ' + esc(l.statusRaw) + ' but principal is fully repaid</span>' : '') + '</div>' +
      kv([['Credited', fmtD(l.cd)], ['Principal', peso(l.orig)], ['Repaid principal', peso(l.paid)], ['Outstanding', l.out > 0.5 ? peso(l.out) : '—'], ['Tenor', (l.tenor || '—') + ' days'], ['Maturity', fmtD(l.mat) + (l.active && l.daysToMat != null ? (l.daysToMat < 0 ? ' · ' + (-l.daysToMat) + 'd past' : ' · in ' + l.daysToMat + 'd') : '')], ['Sales officer', esc(l.so || '—')], ['Requested via', esc(l.via || '—')], ['Collateral docs', /^yes/i.test(l.docs) ? 'Received' : 'Not recorded'], ['Encumbrance check', /^yes/i.test(l.enc) ? 'Done' : 'Not recorded']]);
    if (l.dues.length) h += '<h6 class="muted small" style="text-transform:uppercase">Open payment milestones</h6>' + tb(['Milestone', 'Due', 'Status'], l.dues.map(x => '<tr><td>' + x.label + '</td><td>' + fmtD(x.date) + '</td><td class="' + (x.kind === 'overdue' ? 'od' : '') + '">' + esc(x.st) + '</td></tr>').join(''));
  }
  if (d) h += '<h6 class="muted small" style="text-transform:uppercase">Disbursal</h6>' + kv([['Stage', pill(d.pending ? 't-amber' : 't-green', d.stage)], ['Net disbursed', peso(d.net)], ['Requested', dtm(d.req)], ['Credited to dealer', dtm(d.cred)], ['Endorsed to Netbank', dtm(d.endo)], ['Netbank disbursed', fmtD(d.nb) + (d.nb ? ' · ' + peso(d.nbAmt) : '')], ['Received at Carmudi', fmtD(d.carm)], ['Amount check', d.mismatch ? pill('t-red', 'Mismatch ' + peso(d.diff)) : d.nb ? 'Matched' : '—']]);
  const pays = (PBY[baseId(id)] || []).slice().sort((a, b) => a.date - b.date);
  h += '<h6 class="muted small" style="text-transform:uppercase">Payments</h6>' + tb(['Date', 'Type', 'Received', 'Principal', 'Interest', 'Fees', 'Remitted'], pays.map(p => '<tr><td>' + fmtD(p.date) + '</td><td>' + esc(p.type) + '</td><td style="text-align:right">' + peso(p.recv) + '</td><td style="text-align:right">' + peso(p.prin) + '</td><td style="text-align:right">' + peso(p.int) + '</td><td style="text-align:right">' + peso(p.fee + p.pen) + '</td><td>' + (p.rem ? fmtD(p.rem) : p.prod === 'v3' || !/netbank/i.test(p.fin) ? '—' : 'pending') + '</td></tr>').join('') || '<tr><td colspan="7" class="muted">No payments recorded</td></tr>');
  openSheet(h + '<div class="stickyact" style="position:static"><button class="btn" data-act="closesheet">Close</button></div>');
}

/* ══════════════════════════════════════════════════
   SHELL — filters, tabs, routing
══════════════════════════════════════════════════ */
function render() {
  const host = document.getElementById('view'); TABLES = {};
  const nExc = EXC.filter(pf).length, upd = TODAY;
  const chips = (k, opts) => '<div class="chips">' + opts.map(o => '<button class="chip' + (S[k] === o[0] ? ' on' : '') + '" data-act="flt" data-k="' + k + '" data-v="' + o[0] + '">' + o[1] + '</button>').join('') + '</div>';
  host.innerHTML = '<div class="hero"><div><h1>Operations overview</h1><div class="sub">Drawdown, disbursal and repayment trackers in one view · data as of ' + fmtD(TODAY) + ' (' + numS(LOANS.length) + ' loans · ' + numS(PAYS.length) + ' payments)</div></div>' +
    '<div style="display:flex;gap:14px;flex-wrap:wrap">' + chips('prod', [['all', 'All loans'], ['v2', 'v2 (main)'], ['v3', 'v3 (180/90-day)']]) + chips('fin', [['all', 'All financiers'], ['Netbank', 'Netbank'], ['Finsso', 'Finsso']]) + '</div></div>' +
    '<div class="tabs" id="tabs">' + [['overview', 'Overview'], ['deals', 'Drawdowns &amp; disbursals'], ['pays', 'Repayments'], ['exc', 'Exceptions' + (nExc ? ' (' + nExc + ')' : '')]].map(t => '<button data-act="tab" data-t="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</div><div id="tabbody"></div>';
  const v = S.tab === 'deals' ? dealTab() : S.tab === 'pays' ? payTab() : S.tab === 'exc' ? excTab() : overviewTab();
  document.getElementById('tabbody').innerHTML = v.html; v.after();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return; const a = t.dataset.act, v = t.dataset.v;
  if (a === 'tab') { S.tab = t.dataset.t; render(); window.scrollTo(0, 0); }
  else if (a === 'flt') { S[t.dataset.k] = v; render(); }
  else if (a === 'sub') { S.sub = v; render(); } else if (a === 'lf') { S.lf = v; render(); } else if (a === 'dp') { S.dp = v; render(); } else if (a === 'py') { S.py = v; render(); } else if (a === 'ex') { S.ex = v; render(); }
  else if (a === 'closesheet') closeSheet();
  else if (a === 'go') { const g = t.dataset.go.split('|'); if (g[0] === 'loans') { S.tab = 'deals'; S.sub = 'loans'; S.lf = g[1]; } else if (g[0] === 'pipe') { S.tab = 'deals'; S.sub = 'pipe'; S.dp = g[1]; } else if (g[0] === 'pays') { S.tab = 'pays'; S.py = g[1]; } else if (g[0] === 'exc') { S.tab = 'exc'; S.ex = 'all'; } render(); window.scrollTo(0, 0); }
});
document.getElementById('theme-btn').addEventListener('click', () => { const r = document.documentElement; const cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); r.dataset.theme = cur === 'dark' ? 'light' : 'dark'; });
var ALLOWLIST = null;
async function _loadAllowlist() {
  if (ALLOWLIST !== null) return ALLOWLIST;
  for (let a = 0; a < 3; a++) {
    if (a) await new Promise(r => setTimeout(r, a * 500));
    try {
      const r = await fetch(ALLOWLIST_API + '?action=allowlist&tab=' + encodeURIComponent(ALLOWLIST_TAB) + '&_=' + Date.now()), j = await r.json();
      const list = (j.emails || []).map(s => String(s).toLowerCase().trim()).filter(Boolean);
      const entries = Array.isArray(j.entries) ? j.entries.map(e => ({ email: String(e.email || '').toLowerCase().trim(), unrestricted: !!e.unrestricted, teams: (e.teams || []).map(String) })) : null;
      return (ALLOWLIST = { emails: list, entries });
    } catch (e) {}
  }
  return null;
}
async function _isAllowed(email) {
  const data = await _loadAllowlist(); if (!data) return { ok: false, reason: 'load-failed' };
  email = String(email).toLowerCase().trim(); const at = email.indexOf('@'), dom = at >= 0 ? email.slice(at) : '';
  if (!data.entries) return data.emails.indexOf(email) >= 0 || (dom && data.emails.indexOf(dom) >= 0) ? { ok: true } : { ok: false, reason: 'not-listed' };
  const exact = data.entries.filter(e => e.email === email), pool = exact.length ? exact : data.entries.filter(e => dom && e.email === dom);
  // "Team <name>" tags only scope the sales dashboards, so only rows that grant this dashboard (unrestricted for Operations) count here
  return pool.some(e => e.unrestricted) ? { ok: true } : { ok: false, reason: 'not-listed' };
}
function _decodeJwt(t) { try { const p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(decodeURIComponent(escape(atob(p)))); } catch (e) { return null; } }
function _authError(m) { const e = document.getElementById('lock-err'); if (e) e.textContent = m; }
function _logAccess(email) { try { fetch(ALLOWLIST_API + '?action=log&tab=' + encodeURIComponent(ALLOWLIST_TAB) + '&email=' + encodeURIComponent(email) + '&ua=' + encodeURIComponent(navigator.userAgent) + '&dashboard=' + encodeURIComponent(location.origin + location.pathname), { mode: 'no-cors' }).catch(() => {}); } catch (e) {} }
var _booted = false;
async function _grant(profile) {
  if (_booted) return; _booted = true; ME = profile; _logAccess(profile.email);
  document.getElementById('avatar').textContent = initials(profile.name || profile.email); document.getElementById('who-name').textContent = profile.name || profile.email;
  const s = document.getElementById('lock-overlay'); s.classList.add('unlocking'); setTimeout(() => s.classList.add('hidden'), 400);
  document.getElementById('view').innerHTML = '<div class="loading"><span class="spin"></span>Loading drawdown, disbursal and repayment trackers…<div class="small">This pulls several data files, so the first open takes a moment.</div></div>';
  try { await loadAll(); } catch (e) { _booted = false; document.getElementById('view').innerHTML = '<div class="card empty">Could not load the data: ' + esc(e.message) + '<br><br><button class="btn" onclick="location.reload()">Retry</button></div>'; return; }
  render();
}
async function _onGoogleCredential(resp) {
  _authError(''); const data = _decodeJwt(resp && resp.credential);
  if (!data || !data.email) return _authError('Could not read your Google account. Try again.');
  if (data.email_verified === false) return _authError('Your Google email is not verified.');
  const r = await _isAllowed(data.email);
  if (r.ok) _grant({ email: String(data.email).toLowerCase(), name: data.name || '' });
  else if (r.reason === 'load-failed') _authError('Could not verify access right now — check your connection and try again.');
  else { try { google.accounts.id.disableAutoSelect(); } catch (e) {} _authError(data.email + ' does not have access to the Operations dashboard. Ask the admin to add “Operations” next to your email in the Allowlist.'); }
}
function _initGoogleAuth() {
  if (!window.google || !google.accounts || !google.accounts.id) return setTimeout(_initGoogleAuth, 200);
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: _onGoogleCredential, auto_select: true, cancel_on_tap_outside: false });
  google.accounts.id.renderButton(document.getElementById('g-signin'), { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', logo_alignment: 'center', width: 260 });
  google.accounts.id.prompt();
}
_loadAllowlist();
if (document.readyState !== 'loading') _initGoogleAuth(); else document.addEventListener('DOMContentLoaded', _initGoogleAuth);
</script>
