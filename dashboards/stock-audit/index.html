<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E8461E">
<title>Stock Audit</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --primary:#E8461E;--accent:#F97316;--bg:#F0F4FD;--card:#FFFFFF;--card2:#F7F8FC;
  --border:rgba(0,0,0,0.09);--text:#111827;--text2:#4B5563;--text3:#8A92A0;
  --red:#DC2626;--red-bg:rgba(220,38,38,0.10);--orange:#EA580C;--orange-bg:rgba(234,88,12,0.11);
  --amber:#B45309;--amber-bg:rgba(245,158,11,0.15);--green:#15803D;--green-bg:rgba(22,163,74,0.12);
  --blue:#2563EB;--blue-bg:rgba(37,99,235,0.10);--grey-bg:rgba(107,114,128,0.12);
  --shadow:0 1px 2px rgba(0,0,0,0.05),0 4px 14px rgba(30,41,90,0.07);
  --nav-h:62px;--r:14px;
}
:root[data-theme="dark"]{
  --bg:#0B0F1A;--card:#161B29;--card2:#1C2233;--border:rgba(255,255,255,0.10);
  --text:#E5E7EB;--text2:#A1A9B8;--text3:#6B7280;
  --red:#F87171;--red-bg:rgba(248,113,113,0.14);--orange:#FB923C;--orange-bg:rgba(251,146,60,0.14);
  --amber:#FBBF24;--amber-bg:rgba(251,191,36,0.14);--green:#4ADE80;--green-bg:rgba(74,222,128,0.13);
  --blue:#60A5FA;--blue-bg:rgba(96,165,250,0.14);--grey-bg:rgba(156,163,175,0.14);
  --shadow:0 1px 2px rgba(0,0,0,0.4),0 4px 14px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}html[data-theme="dark"]{color-scheme:dark}html[data-theme="light"]{color-scheme:light}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:200;background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.brand{font-weight:700;color:var(--primary);font-size:17px;letter-spacing:-0.3px;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--text3);font-weight:500;letter-spacing:0}
.top-sp{flex:1}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.who-txt{line-height:1.2;min-width:0}.who-txt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}.who-txt span{font-size:11px;color:var(--text3)}
.icon-btn{border:1px solid var(--border);background:var(--card2);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--text2)}
.lens{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media(max-width:700px){
  .topbar{flex-wrap:wrap;row-gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
  .who-txt{display:none}
  .lens{order:5;width:100%}
  .lens:empty{display:none}
  .brand{font-size:16px}
  .main{padding:12px}
}

/* ── navigation: top tabs on laptop, bottom bar on phone ── */
.nav{display:flex;gap:4px;position:fixed;left:0;right:0;bottom:0;z-index:250;background:var(--card);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,0.08)}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:5px 2px;border-radius:10px;color:var(--text3);min-height:46px;font-weight:600}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--primary);background:rgba(232,70,30,0.09)}
.nav button.hide{display:none}
.nav .fab{color:#fff;background:linear-gradient(135deg,var(--accent),var(--primary));margin:-14px 4px 0;border-radius:16px;box-shadow:0 6px 16px rgba(232,70,30,0.35);flex:1.15}
.nav .fab.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--primary))}
@media(min-width:900px){
  body{padding-bottom:30px}
  .nav{position:sticky;top:55px;bottom:auto;border-top:0;border-bottom:1px solid var(--border);box-shadow:none;padding:0 16px;gap:2px;justify-content:flex-start;z-index:190}
  .nav button{flex:none;flex-direction:row;gap:7px;font-size:13px;padding:11px 16px;border-radius:0;border-bottom:3px solid transparent;min-height:0}
  .nav button.on{background:none;border-bottom-color:var(--primary)}
  .nav .fab{margin:6px 0 6px 10px;border-radius:10px;padding:7px 16px;border-bottom:0;flex:none}
  .nav .fab.on{border-bottom:0}
}

/* ── layout ── */
.main{max-width:1180px;margin:0 auto;padding:16px}
.h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}.sub{color:var(--text3);font-size:12.5px;margin-top:2px}
.sec{margin-top:20px}.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}.sec-h h2{font-size:15px;font-weight:700}.sec-h .sub{margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;text-align:left;cursor:pointer;display:block;width:100%}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-0.5px;line-height:1.1}.kpi .l{font-size:11.5px;color:var(--text2);margin-top:3px;font-weight:600}.kpi .s{font-size:10.5px;color:var(--text3);margin-top:1px}
.kpi.red .n{color:var(--red)}.kpi.orange .n{color:var(--orange)}.kpi.amber .n{color:var(--amber)}.kpi.green .n{color:var(--green)}.kpi.blue .n{color:var(--blue)}
.two{display:grid;gap:14px}@media(min-width:900px){.two{grid-template-columns:1.5fr 1fr}}
.cols3{display:grid;gap:12px}@media(min-width:760px){.cols3{grid-template-columns:repeat(2,1fr)}}@media(min-width:1100px){.cols3{grid-template-columns:repeat(3,1fr)}}

/* ── pills / chips / buttons ── */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-crit{background:var(--red);color:#fff}.p-high{background:var(--orange-bg);color:var(--orange)}.p-soon{background:var(--amber-bg);color:var(--amber)}.p-ok{background:var(--grey-bg);color:var(--text2)}
.t-red{background:var(--red-bg);color:var(--red)}.t-orange{background:var(--orange-bg);color:var(--orange)}.t-green{background:var(--green-bg);color:var(--green)}.t-blue{background:var(--blue-bg);color:var(--blue)}.t-purple{background:rgba(124,92,230,.14);color:#6d4fd6}.kpi.purple .n{color:#6d4fd6}:root[data-theme='dark'] .kpi.purple .n,:root[data-theme='dark'] .t-purple{color:#b9a4ff}.t-grey{background:var(--grey-bg);color:var(--text2)}.t-amber{background:var(--amber-bg);color:var(--amber)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--text2);min-height:34px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--primary);color:#fff}
.btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--primary));border-color:transparent;color:#fff}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12px;border-radius:8px}
.btn.ghost{background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.search{width:100%;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px 12px;min-height:42px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.toolbar .search{flex:1;min-width:180px}
.empty{padding:30px 14px;text-align:center;color:var(--text3)}
.muted{color:var(--text3)}.small{font-size:12px}.b{font-weight:700}

/* ── work items ── */
.item{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--grey-bg);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.item.crit{border-left-color:var(--red)}.item.high{border-left-color:var(--orange)}.item.soon{border-left-color:var(--amber)}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item-t{font-weight:700;font-size:14px}.item-s{font-size:12px;color:var(--text2)}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.list{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.dcard-h{padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.dcard-body[hidden]{display:none}
.dcard-body{border-top:1px solid var(--border);background:var(--card2);padding:10px;display:flex;flex-direction:column;gap:8px}
.dcard .addr{font-size:12px;color:var(--text2)}
.dd-mini{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--grey-bg);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.dd-mini.crit{border-left-color:var(--red)}.dd-mini.high{border-left-color:var(--orange)}.dd-mini.soon{border-left-color:var(--amber)}
.stopno{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.bar{height:8px;border-radius:99px;background:var(--grey-bg);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:99px}

/* ── data table (every column filterable) ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 230px);-webkit-overflow-scrolling:touch}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.dt th{position:sticky;top:0;z-index:3;background:var(--card2);text-align:left;padding:0;border-bottom:1px solid var(--border);white-space:nowrap}
.dt th .th{display:flex;align-items:center;gap:4px;padding:9px 8px 9px 10px;font-weight:700;font-size:11.5px;color:var(--text2)}
.dt th .th span{flex:1;cursor:pointer;user-select:none}
.fbtn{border:0;background:none;padding:3px 5px;border-radius:6px;color:var(--text3);font-size:11px}
.fbtn.on{background:var(--primary);color:#fff}
.dt td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card)}
.dt tr:hover td{background:var(--card2)}
.dt td.fz,.dt th.fz{position:sticky;left:0;z-index:4;box-shadow:2px 0 0 var(--border)}
.dt th.fz{z-index:6}
.dt td.num,.dt th.num .th{text-align:right;justify-content:flex-end}
.dt td.click{cursor:pointer}
.fpanel{position:fixed;z-index:1200;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,0.25);width:290px;max-width:calc(100vw - 20px);max-height:70vh;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.fpanel .row{display:flex;gap:6px}.fpanel button.o{flex:1;border:1px solid var(--border);background:var(--card2);border-radius:8px;padding:7px;font-size:12px;font-weight:600}
.fpanel input[type=text],.fpanel select{width:100%;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:8px}
.fpanel .vals{max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:4px}
.fpanel label{display:flex;gap:8px;align-items:center;padding:5px 6px;font-size:12.5px;border-radius:6px}
.fpanel label:hover{background:var(--card2)}
.fpanel h6{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:700px){.fpanel{left:8px!important;right:8px;bottom:8px;top:auto!important;width:auto;max-height:78vh}}

/* ── sheet / modal ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:900;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,0.3)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-size:16px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin:10px 0}
.kv div{font-size:12.5px}.kv span{display:block;font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:8px}.tl .e{border-left:3px solid var(--grey-bg);padding:2px 0 2px 10px;font-size:12.5px}.tl .e.f{border-left-color:var(--red)}.tl .e.p{border-left-color:var(--green)}

/* ── form ── */
.form{display:flex;flex-direction:column;gap:14px;max-width:720px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld>.lab{font-size:12px;font-weight:700;color:var(--text2)}
.fld .req{color:var(--red)}
.inp{width:100%;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:11px 12px;min-height:46px;font-size:15px}
textarea.inp{min-height:84px;resize:vertical}
.inp[readonly]{background:var(--card2);color:var(--text2)}
.hint{font-size:11.5px;color:var(--text3)}
.bigseg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigseg button{border:2px solid var(--border);background:var(--card);border-radius:12px;padding:14px;font-weight:800;font-size:16px}
.bigseg button.on.pass{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.bigseg button.on.fail{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.ph img{width:100%;height:100%;object-fit:cover}.ph button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;width:22px;height:22px;border-radius:50%;font-size:13px;line-height:1}
.addph{width:76px;height:76px;border-radius:10px;border:2px dashed var(--border);background:var(--card2);color:var(--text2);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.callout{border-radius:12px;padding:10px 12px;font-size:12.5px}
.callout.warn{background:var(--amber-bg);color:var(--amber)}.callout.bad{background:var(--red-bg);color:var(--red)}.callout.good{background:var(--green-bg);color:var(--green)}.callout.info{background:var(--blue-bg);color:var(--blue)}
.stickyact{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);display:flex;gap:10px;padding:10px 0;background:linear-gradient(to top,var(--bg) 70%,transparent)}
@media(min-width:900px){.stickyact{bottom:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:2000;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:90vw}
.toast.err{background:var(--red)}
.spin{width:18px;height:18px;border:3px solid var(--grey-bg);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:70px 20px;color:var(--text3)}

/* ── lock ── */
.lock-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .35s}
.lock-overlay.unlocking{opacity:0;pointer-events:none}.lock-overlay.hidden{display:none}
.lock-card{background:var(--card);border:1px solid var(--border);box-shadow:0 30px 80px rgba(30,41,90,0.2);border-radius:26px;padding:34px 30px 26px;width:360px;max-width:92vw;display:flex;flex-direction:column;align-items:center}
.lock-icon-box{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--primary));box-shadow:0 4px 16px rgba(232,70,30,0.30);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.lock-icon-box svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lock-title{font-size:18px;font-weight:700;margin-bottom:6px;text-align:center}.lock-sub{font-size:12.5px;color:var(--text3);margin-bottom:20px;text-align:center;line-height:1.6}
.lock-signin{min-height:44px;display:flex;justify-content:center}.lock-error-msg{font-size:12px;color:var(--red);margin-top:10px;min-height:16px;text-align:center}
.lock-contact{font-size:11px;color:var(--text3);text-align:center;margin-top:14px}.lock-contact a{color:var(--primary);text-decoration:underline}
</style></head>
<body>
<div class="lock-overlay" id="lock-overlay">
  <div class="lock-card">
    <div class="lock-icon-box"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
    <div class="lock-title">Stock Audit</div>
    <div class="lock-sub">Sign in with your Finsso account<br>to open your audit schedule</div>
    <div id="g-signin" class="lock-signin"></div>
    <div class="lock-error-msg" id="lock-err"></div>
    <div class="lock-contact">Need access? Contact <a href="mailto:miguel.cordero@finsso.com">miguel.cordero@finsso.com</a></div>
  </div>
</div>

<div class="topbar">
  <div class="brand">Stock Audit<small id="today-lbl"></small></div>
  <div class="top-sp"></div>
  <div class="lens" id="lens"></div>
  <div class="who"><div class="avatar" id="avatar">?</div><div class="who-txt"><b id="who-name">—</b><span id="who-role"></span></div></div>
  <button class="icon-btn" id="theme-btn" title="Light / dark">◐</button>
</div>

<div class="nav" id="nav">
  <button data-view="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-view="itin"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>Itinerary</button>
  <button data-view="audit" class="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Audit</button>
  <button data-view="dealers"><svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/></svg>Dealers</button>
  <button data-view="dd"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Drawdowns</button>

/* ══════════════════════════════════════════════════
   30 / 15 / 7 / 3 SCHEDULING RULE + PRIORITY
   · first audit due 30 days after the drawdown credit date
   · then 15 days after a Passed audit, 3 days after a Failed audit
   · while the account is on DPD, no longer than 7 days between audits
   Priority ranks by scheduled date first (overdue → due soon), then lifts accounts
   that are on DPD or have failed twice in a row.
══════════════════════════════════════════════════ */
function computeSchedule(d) {
  const h = d.hist, last = h.length ? h[h.length - 1] : null;
  let due, basis, interval = null;
  if (!last) {
    due = d.credit ? addDays(d.credit, 30) : TODAY;
    basis = d.credit ? '30 days after drawdown (first audit)' : 'No credit date on record';
  } else {
    const pass = /^pass/i.test(last.status);
    interval = pass ? 15 : 3;
    let why = pass ? 'Passed' : 'Failed';
    if ((d.inDpd || d.dpdDays >= 1) && interval > 7) { interval = 7; why += ' + on DPD'; }
    else if (d.inDpd || d.dpdDays >= 1) why += ' + on DPD';
    due = addDays(last.date, interval);
    basis = interval + ' days after ' + why + ' audit on ' + fmtD(last.date);
  }
  let streak = 0;
  for (let i = h.length - 1; i >= 0 && /^fail/i.test(h[i].status); i--) streak++;
  d.last = last; d.due = due; d.basis = basis; d.interval = interval;
  d.soldTag = !!(last && /\bsold\b/i.test(last.remarks || ''));      // latest inspection's remarks say "Sold"
  d.failStreak = streak; d.multiFail = streak >= 2 || (d.failFlag && streak >= 1);
  d.daysToDue = diffDays(due, TODAY);
  d.overdue = d.daysToDue < 0; d.overdueDays = d.overdue ? -d.daysToDue : 0;
  d.dpdOn = d.inDpd || d.dpdDays >= 1;
  let sc = 0;
  if (d.daysToDue < 0) sc = 400 + Math.min(d.overdueDays, 45);
  else if (d.daysToDue === 0) sc = 350;
  else if (d.daysToDue <= 3) sc = 250 - d.daysToDue * 5;
  else if (d.daysToDue <= 7) sc = 150 - d.daysToDue;
  else sc = Math.max(0, 100 - d.daysToDue);
  if (d.multiFail) sc += 60;
  if (d.soldTag) sc += 100;
  if (d.dpdOn) sc += 40 + Math.min(d.dpdDays, 90) / 3;
  d.score = sc;
  if (d.soldTag || (d.daysToDue <= 0 && (d.multiFail || d.dpdOn))) { d.prio = 'Critical'; d.pc = 'crit'; }
  else if (d.daysToDue < 0) { d.prio = 'High'; d.pc = 'high'; }
  else if (d.daysToDue <= 3) { d.prio = 'Due soon'; d.pc = 'soon'; }
  else if (d.daysToDue <= 7) { d.prio = 'This week'; d.pc = 'ok'; }
  else { d.prio = 'Scheduled'; d.pc = 'ok'; }
}
function computeAll() { OPEN.forEach(computeSchedule); }

function dueText(d) {
  if (d.daysToDue < 0) return 'Overdue ' + d.overdueDays + 'd';
  if (d.daysToDue === 0) return 'Due today';
  if (d.daysToDue === 1) return 'Due tomorrow';
  return 'Due in ' + d.daysToDue + 'd';
}

/* ══════════════════════════════════════════════════

══════════════════════════════════════════════════ */
function makeTable(host, cols, rows, o) {
  o = o || {};

  let cur = [];
  const txt = (c, r) => { const v = c.txt ? c.txt(r) : c.val(r); return v == null || v === '' ? '(blank)' : String(v); };
  const raw = (c, r) => { const v = c.val(r); return v instanceof Date ? v.getTime() : v; };
  function cond(c, f, r) {
    const v = raw(c, r), q = f.v;
    if (f.op === 'empty') return v === '' || v == null || v === 0 && c.type !== 'num';
    if (f.op === 'nempty') return !(v === '' || v == null);
    if (c.type === 'num' || c.type === 'date') {
      const n = c.type === 'date' ? (q ? new Date(q + 'T00:00:00').getTime() : NaN) : parseFloat(q);
      if (isNaN(n)) return true; const x = Number(v);
      return f.op === 'eq' ? x === n : f.op === 'gt' ? x > n : f.op === 'lt' ? x < n : f.op === 'gte' ? x >= n : x <= n;
    }
    const s = String(v == null ? '' : v).toLowerCase(), t = String(q || '').toLowerCase();
    return f.op === 'contains' ? s.includes(t) : f.op === 'ncontains' ? !s.includes(t) : f.op === 'eq' ? s === t : s.startsWith(t);
  }
  function pass(r) {
    for (const c of cols) { const f = st.f[c.id]; if (!f) continue;
      if (f.sel && !f.sel.has(txt(c, r))) return false;
      if (f.op && !cond(c, f, r)) return false; }
    return true;
  }
  function viewRows() {
    let r = rows.filter(pass);
    if (st.sort) { const c = cols.find(x => x.id === st.sort.id), dir = st.sort.dir;
      r = r.slice().sort((a, b) => { let x = raw(c, a), y = raw(c, b);
        if (x == null || x === '') return 1; if (y == null || y === '') return -1;
        return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true })) * dir; }); }
    return r;
  }
  const active = id => { const f = st.f[id]; return !!f && (!!f.sel || !!f.op); };
  function render() {
    cur = viewRows();

    let h = '<div class="toolbar" style="margin:0 0 8px"><span class="small muted">' + cur.length.toLocaleString() + ' of ' + rows.length.toLocaleString() + ' rows' + (nF ? ' · ' + nF + ' filter' + (nF > 1 ? 's' : '') : '') + '</span>' +
      (nF || st.sort ? '<button class="btn sm ghost" data-t="clear">Clear filters &amp; sort</button>' : '') + '<span style="flex:1"></span>' + (o.csv ? '<button class="btn sm" data-t="csv">Export CSV</button>' : '') + '</div>';
    h += '<div class="tbl-wrap"' + (o.maxH ? ' style="max-height:' + o.maxH + '"' : '') + '><table class="dt"><thead><tr>';
    cols.forEach(c => { const srt = st.sort && st.sort.id === c.id ? (st.sort.dir > 0 ? ' ▲' : ' ▼') : '';
      h += '<th class="' + (c.fz ? 'fz ' : '') + (c.type === 'num' ? 'num' : '') + '"><div class="th"><span data-t="sort" data-c="' + c.id + '">' + esc(c.label) + srt + '</span><button class="fbtn' + (active(c.id) ? ' on' : '') + '" data-t="f" data-c="' + c.id + '" title="Filter">▾</button></div></th>'; });
    h += '</tr></thead><tbody>';
    const MAX = 800;
    cur.slice(0, MAX).forEach((r, i) => { h += '<tr data-i="' + i + '">';
      cols.forEach(c => { h += '<td class="' + (c.fz ? 'fz ' : '') + (c.type === 'num' ? 'num ' : '') + (o.onRow ? 'click' : '') + '">' + (c.html ? c.html(r) : esc(c.txt ? c.txt(r) : (c.val(r) instanceof Date ? fmtD(c.val(r)) : c.val(r)))) + '</td>'; });
      h += '</tr>'; });
    if (!cur.length) h += '<tr><td colspan="' + cols.length + '" class="empty">No rows match these filters.</td></tr>';
    h += '</tbody></table></div>';
    if (cur.length > MAX) h += '<div class="small muted" style="margin-top:6px">Showing the first ' + MAX + ' rows — narrow with filters to see the rest.</div>';
    host.innerHTML = h;
  }
  function closePanel() { if (st.panel) { st.panel.remove(); st.panel = null; document.removeEventListener('mousedown', outside, true); } }
  function outside(e) { if (st.panel && !st.panel.contains(e.target) && !(e.target.closest && e.target.closest('.fbtn'))) closePanel(); }
  function openPanel(id, anchor) {
    closePanel();
    const c = cols.find(x => x.id === id), f = st.f[id] || (st.f[id] = {});
    const p = document.createElement('div'); p.className = 'fpanel';
    const ops = c.type === 'num' ? [['eq', '='], ['gt', '>'], ['gte', '≥'], ['lt', '<'], ['lte', '≤']] : c.type === 'date' ? [['eq', 'Is on'], ['gt', 'After'], ['lt', 'Before'], ['gte', 'On or after'], ['lte', 'On or before']] : [['contains', 'Contains'], ['ncontains', 'Does not contain'], ['eq', 'Is exactly'], ['starts', 'Starts with']];

      '<h6>Filter by values</h6><input type="text" data-k="q" placeholder="Search values…"><div class="row"><button class="o" data-s="all">Select all</button><button class="o" data-s="none">Clear</button></div><div class="vals" data-k="list"></div>' +
      '<div class="row"><button class="o" data-s="reset">Reset column</button><button class="o" data-s="done" style="background:var(--primary);color:#fff;border-color:var(--primary)">Done</button></div>';
    const list = p.querySelector('[data-k=list]');

      list.innerHTML = keys.filter(k => !q || k.toLowerCase().includes(q)).slice(0, 400).map(k => '<label><input type="checkbox" data-v="' + esc(k) + '"' + (!sel || sel.has(k) ? ' checked' : '') + '>' + esc(k) + ' <span class="muted small">(' + vals[k] + ')</span></label>').join('') || '<div class="empty small">No values</div>'; };
    draw();
    p.addEventListener('input', e => {

}

function routeKey() { return 'sa-route-' + (ME ? ME.email : ''); }

function dealerGroups(list) {
  const m = {};
  list.forEach(d => { const k = d.dealerId || d.dealer; (m[k] = m[k] || { key: k, dealer: dealerOf(d), name: d.dealer, items: [], max: 0 }); const g = m[k]; g.items.push(d); g.max = Math.max(g.max, d.score); });
  return Object.values(m).sort((a, b) => b.max - a.max);
}
function hav(a, b) { const R = 6371, t = x => x * Math.PI / 180, dLa = t(b.lat - a.lat), dLo = t(b.lng - a.lng); const q = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(q)); }
function routeDealers() {
  const all = dealerGroups(lensList());
  const picked = S.route.map(k => all.find(g => g.key === k)).filter(Boolean);
  if (picked.length < 2) return picked.map(g => ({ key: g.key, name: g.name, dealer: g.dealer, items: g.items }));
  const withC = picked.filter(g => g.dealer.lat != null), noC = picked.filter(g => g.dealer.lat == null);
  const ord = []; let rest = withC.slice();
  if (rest.length) { rest.sort((a, b) => b.max - a.max); let c = rest.shift(); ord.push(c);
    while (rest.length) { let bi = 0, bd = 1e9; rest.forEach((g, i) => { const dd = hav(c.dealer, g.dealer); if (dd < bd) { bd = dd; bi = i; } }); c = rest.splice(bi, 1)[0]; ord.push(c); } }
  return ord.concat(noC).map(g => ({ key: g.key, name: g.name, dealer: g.dealer, items: g.items }));
}

}
